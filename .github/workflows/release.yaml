name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: h5i
  # The browser engine ships as its own binary, because it is usable — and
  # useful — with no h5i anywhere: its allowlist and its fail-closed receipts
  # are enforced by the engine rather than by a box. It cannot go to crates.io
  # (it depends on boa by git revision, which crates.io refuses; see
  # scripts/check_boa_release.sh), so a release archive is the only way anyone
  # gets it.
  ENGINE_NAME: h5i-browser-light

permissions:
  contents: write

# Never cancel a release mid-flight: a half-uploaded set of assets is worse
# than a duplicated run. Declared explicitly so it does not inherit a
# cancelling default if one is ever added at the repository level.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The `h5i ui` console is a React bundle embedded into the binary at compile
  # time. Built once here and fanned out to every target job rather than built
  # four times, which also keeps Node off three of the four runners. Every build
  # job sets H5I_SKIP_WEB_BUILD=1 and consumes this artifact.
  bundle:
    name: Build the console bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The lockfile covers this runner's platform
        working-directory: web
        run: node ../scripts/check-lockfile-platforms.mjs

      - name: Build web/dist
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The artifact pair is held at the *oldest* major that runs on Node 24
      # (upload v6, download v7) rather than at the newest, deliberately. Getting
      # off the deprecated Node 20 runtime is the whole point of the pin, and the
      # newer majors change behaviour rather than just the runtime: upload v7
      # adds direct unzipped uploads, and download v8 turns a hash mismatch into
      # an error. Both may well be improvements, and neither is testable here —
      # nothing in this file runs on a pull request, so a release is where it
      # would be found out. Take those on their own, when they are the change.
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — native
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive_ext: tar.gz

          # Linux aarch64 — native, on GitHub's arm64 runner
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive_ext: tar.gz

          # macOS arm64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip

    steps:
      - uses: actions/checkout@v7

      # Placed before the build so `rust-embed` finds a real bundle. With
      # H5I_SKIP_WEB_BUILD set the build script leaves an existing web/dist
      # alone and never reaches for npm.
      - name: Fetch the console bundle
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist

      # The one failure this pipeline cannot afford to be quiet about. Because
      # every build below sets H5I_SKIP_WEB_BUILD, a bundle that failed to land
      # does not stop the build — the build script writes a placeholder page and
      # the release ships a binary whose `h5i ui` serves "console bundle not
      # built" with a 200. Assert the real thing is here while it is still a
      # build failure rather than a download someone installs.
      - name: The bundle is real, not the build-script stub
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing"; exit 1; }
          if grep -q "console bundle not built" web/dist/index.html; then
            echo "::error::web/dist holds the build-script stub, not the console bundle."
            exit 1
          fi
          grep -q '/assets/' web/dist/index.html || {
            echo "::error::web/dist/index.html references no bundled asset."
            cat web/dist/index.html
            exit 1
          }
          test -d web/dist/assets
          echo "bundle ok: $(find web/dist/assets -type f | wc -l) asset(s)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # musl linker/compiler; OpenSSL is vendored so no system libssl-dev needed
      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y musl-tools

      # Every target builds natively, aarch64 Linux included: it used to go
      # through `cross`, whose container is Ubuntu 18.04 with no python in it,
      # and stylo generates its CSS property tables by running python at build
      # time. Installing the container's python3 does not help — it is 3.6, and
      # stylo's vendored mako needs 3.8. GitHub's arm64 runners are free for
      # public repositories, so the target that needed the most machinery is
      # now the same three steps as the other three.
      #
      # Both binaries in one job, and failing together on purpose. The engine
      # is a shipped product now rather than an internal component, so a target
      # that cannot build it is a defect in the release — the same reading the
      # asset guard below already takes. Note its dependency set is not h5i's:
      # no git2, but blitz, vello_cpu and boa instead, so a target that builds
      # one does not automatically build the other.
      - name: Build
        env:
          H5I_SKIP_WEB_BUILD: "1"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.ENGINE_NAME }}

      # ── Package ───────────────────────────────────────────────────────────

      # Two archives per target rather than one holding both binaries: someone
      # who wants only the browser should not have to download h5i to get it,
      # and someone installing h5i should not silently acquire a second
      # executable they did not ask for.
      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          package() {
            local name="$1"
            local bin="target/${{ matrix.target }}/release/$name"
            test -x "$bin" || { echo "::error::$bin was not built"; exit 1; }
            local archive="$name-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
            tar -czf "$archive" -C "$(dirname "$bin")" "$(basename "$bin")"
            sha256sum "$archive" > "$archive.sha256"
          }
          package "${{ env.BINARY_NAME }}"
          package "${{ env.ENGINE_NAME }}"

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Package($name) {
            $bin = "target\${{ matrix.target }}\release\$name.exe"
            if (-not (Test-Path $bin)) { throw "$bin was not built" }
            $archive = "$name-${{ github.ref_name }}-${{ matrix.target }}.zip"
            Compress-Archive -Path $bin -DestinationPath $archive
            $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
            "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ASCII
          }
          Package "${{ env.BINARY_NAME }}"
          Package "${{ env.ENGINE_NAME }}"

      # One artifact per target carrying both products' archives. The release
      # job's `h5i-*` pattern picks this up unchanged, because both names start
      # with it.
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.BINARY_NAME }}-*-${{ matrix.target }}.*
            ${{ env.ENGINE_NAME }}-*-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Only the packaged archives, never `web-dist`. The console bundle is an
      # input to the *build* jobs, which embed it in the binary; this job has no
      # use for it, and downloading everything meant `files:` swept it onto the
      # release. v0.3.1 shipped 18 loose JS/CSS/font files next to the archives
      # that way — harmless (the binary already carries its own copy) and wrong.
      - name: Download the target artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # Fail loudly rather than publishing a short set: four targets, each with
      # an archive and a checksum. A build job that silently stopped uploading
      # would otherwise produce a release missing a platform, which nobody
      # notices until someone's install breaks.
      - name: Every expected asset is present, and nothing else
        run: |
          # Four targets x two products x (archive + checksum).
          expected=16
          found=$(find artifacts -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) | wc -l)
          extra=$(find artifacts -mindepth 1 -maxdepth 1 \
            ! \( -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \) )
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected release assets, found $found"
            exit 1
          fi
          if [ -n "$extra" ]; then
            echo "::error::unexpected entries in artifacts/:"
            echo "$extra"
            exit 1
          fi
          echo "ok: $found assets, nothing extra"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: "h5i ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # Flat, and only the archives: `artifacts/**` would pick up any
          # directory a future artifact adds. The guard above already refuses
          # that case; this keeps the upload correct even if the guard changes.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          body: |
            ## Install

            Two binaries. `h5i` is the confined development environment;
            `h5i-browser-light` is its browser engine, which also runs on its
            own as a headless browser for agents.

            **Linux / macOS:**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/h5i-${{ github.ref_name }}-<TARGET>.tar.gz | tar -xz
            sudo mv h5i /usr/local/bin/
            ```

            **Windows:** download the `.zip`, extract `h5i.exe`, and add it to your `PATH`.

            ### The browser on its own

            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/h5i-browser-light-${{ github.ref_name }}-<TARGET>.tar.gz | tar -xz
            sudo mv h5i-browser-light /usr/local/bin/
            h5i-browser-light skill install     # teach an agent to drive it
            ```

            Every request it makes is checked against an allowlist — every
            request and every redirect hop — and written to the receipt before
            any bytes move, with or without h5i. What a box adds is that the
            agent cannot simply go around the browser; on a bare host that part
            is not claimed.

            ### Available targets

            | Target | Platform |
            |--------|---------|
            | `x86_64-unknown-linux-musl` | Linux x86_64 (static, glibc-free) |
            | `aarch64-unknown-linux-musl` | Linux arm64 (static, glibc-free) |
            | `aarch64-apple-darwin` | macOS Apple Silicon (arm64) |
            | `x86_64-pc-windows-msvc` | Windows x86_64 |

            Intel Macs have no published build: Rosetta 2 translates x86_64 to
            arm64, not the reverse, so the `aarch64-apple-darwin` archive will
            not run there. Build from source instead:
            `cargo install --git https://github.com/${{ github.repository }}`

            Each archive is accompanied by a `.sha256` checksum file.

  # The `h5i-agent` Python wheel: the WebAssembly harness as an installable CLI
  # (`pip install <the wheel>` then `h5i-agent web` / `h5i-agent wasmtime`). It
  # bundles the wasm module and the browser page, so it is platform-independent
  # (one py3-none-any wheel, not a per-target build) and is attached out of band
  # rather than threaded through the target matrix and its strict asset guard.
  wheel:
    name: Build and attach the h5i-agent wheel
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        working-directory: crates/h5i-wasm-harness
        run: |
          python -m pip install --upgrade build
          ./scripts/build-wheel.sh

      # Additive upload onto the release the previous job created, so the strict
      # 16-asset guard never has to account for these files. --clobber keeps a
      # re-run idempotent.
      - name: Attach to the release
        working-directory: crates/h5i-wasm-harness/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in h5i_agent-*.whl; do sha256sum "$f" > "$f.sha256"; done
          gh release upload "${{ github.ref_name }}" \
            h5i_agent-*.whl h5i_agent-*.whl.sha256 \
            --repo "${{ github.repository }}" --clobber
