# h5i-app: the verifiable application framework (crates/h5i-app*), its
# examples (examples/app, a separate Cargo workspace) and their Lean proofs.
# Kept apart from test.yaml so a change to the framework does not pay for a
# browser-engine build, and a change to h5i does not pay for Lean.
name: h5i-app

on:
  push:
    branches: [main]
    paths:
      - "crates/h5i-app*/**"
      - "examples/app/**"
      - "examples/embedded/**"
      - "scripts/app/**"
      - "deny.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/app.yaml"
  pull_request:
    paths:
      - "crates/h5i-app*/**"
      - "examples/app/**"
      - "examples/embedded/**"
      - "scripts/app/**"
      - "deny.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/app.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in sync with crates/h5i-app-cli/src/pins.rs, whose test checks every
  # lakefile against it.
  AENEAS_REV: b86120db3183b0107eb5f2637b11c424cd06ef1c

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: h5i
          POSTGRES_PASSWORD: h5i
          POSTGRES_DB: h5i
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U h5i"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      H5I_APP_TEST_DATABASE_URL: postgres://h5i:h5i@127.0.0.1:5432/h5i
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/app
      # Only the h5i-app packages: the rest of the root workspace is the h5i
      # CLI, which test.yaml builds.
      - run: cargo build -p 'h5i-app*' --all-features --all-targets --locked
      - run: cargo build --workspace --all-targets --locked
        working-directory: examples/app
      # The embedded examples: host workspace, then the firmware for Cortex-M.
      - run: cargo test --workspace --locked
        working-directory: examples/embedded
      - run: rustup target add thumbv7em-none-eabihf
      - run: cargo build -p h5i-app-h1 -p h5i-app-embedded --target thumbv7em-none-eabihf --locked
      - run: cargo build --release --locked
        working-directory: examples/embedded/thermostat/firmware
      # A TLS-only PostgreSQL for h5i-app-pg's `tls` tests.
      - run: scripts/app/pg-tls.sh "$RUNNER_TEMP/pg-tls" >> "$GITHUB_ENV"
      - run: scripts/app/ci-rust-tests.sh
      # Routes take an Actor; no client-set identity in a Command.
      - run: cargo app lint --all crates examples/app examples/embedded
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # A8: only h5i-app-pg may depend on database drivers.
      - run: cargo deny check bans
      - run: cargo deny check bans
        working-directory: examples/app

  lean:
    runs-on: ubuntu-latest
    # About 40 minutes when it works; a hung download must not hold a runner for hours.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install elan
        run: |
          curl -sSfL --retry 5 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The pinned Lean toolchains, from cache or downloaded once here with
      # retries, so a transient release-server error (504) fails or recovers
      # in this step instead of failing every project's `lake build`.
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('**/proofs/lean-toolchain') }}
      - name: Install the pinned Lean toolchains
        timeout-minutes: 20
        run: |
          for tc in $(cat $(git ls-files '*proofs/lean-toolchain') | sort -u); do
            for try in 1 2 3 4 5; do
              "$HOME/.elan/bin/elan" toolchain install "$tc" && break
              [ "$try" = 5 ] && { echo "::error::could not install $tc"; exit 1; }
              echo "::warning::installing $tc failed (try $try); retrying"
              sleep $((try * 20))
            done
          done
      # `h5i app check` fetches the Lake packages (Aeneas, Mathlib) once into
      # this cache, shared by every proof project with the same requires.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/h5i/lake
          key: lake-${{ hashFiles('**/proofs/lean-toolchain', '**/proofs/lakefile.lean', '**/proofs/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ hashFiles('**/proofs/lean-toolchain', '**/proofs/lakefile.lean', '**/proofs/lake-manifest.json') }}-
      # Before Nix puts Charon's toolchain on PATH.
      - run: cargo build --release --locked -p h5i-app-xtask
      # An `[authz]` project's check re-extracts it (its gate is only about
      # the kernel when proofs/generated/ is fresh), so it needs both tools.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
            fallback = true
            connect-timeout = 10
            stalled-download-timeout = 120
      # Only a cache: when the GitHub Actions cache service fails, it disables
      # itself mid-build, so Nix must be able to go on without it (fallback
      # and the timeouts above) and the job must not wait on it.
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        continue-on-error: true
      # Usually about 10 minutes. Bounded, and tried twice: a second run
      # reuses what the first one fetched or built.
      - name: Build Charon and Aeneas at the pinned commit
        timeout-minutes: 50
        run: |
          build() {
            for try in 1 2; do
              timeout 20m nix build "$1" -o "$2" -L && return 0
              echo "::warning::nix build $1 failed or timed out (try $try)"
            done
            return 1
          }
          build "github:AeneasVerif/aeneas/$AENEAS_REV" "$RUNNER_TEMP/aeneas"
          build "github:AeneasVerif/aeneas/$AENEAS_REV#charon" "$RUNNER_TEMP/charon"
          echo "$RUNNER_TEMP/aeneas/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/charon/bin" >> "$GITHUB_PATH"
      # Build every proof project and gate it: no sorry, native_decide or
      # axiom, every theorem of a hand-written module on the standard axioms
      # only, and the theorems each h5i-app.toml names present.
      - run: target/release/h5i-app-xtask check --all crates examples/app examples/embedded
  # A9: the committed Lean must be exactly what Aeneas extracts from the kernel.
  extract:
    runs-on: ubuntu-latest
    # About 20 minutes when it works.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Before Nix puts Charon's toolchain on PATH.
      - run: cargo build --release --locked -p h5i-app-xtask
      - uses: cachix/install-nix-action@v31
        with:
          # Aeneas CI pushes its builds here.
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
            fallback = true
            connect-timeout = 10
            stalled-download-timeout = 120
      # Only a cache: when the GitHub Actions cache service fails, it disables
      # itself mid-build, so Nix must be able to go on without it (fallback
      # and the timeouts above) and the job must not wait on it.
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        continue-on-error: true
      # Usually about 10 minutes. Bounded, and tried twice: a second run
      # reuses what the first one fetched or built.
      - name: Build Charon and Aeneas at the pinned commit
        timeout-minutes: 50
        run: |
          build() {
            for try in 1 2; do
              timeout 20m nix build "$1" -o "$2" -L && return 0
              echo "::warning::nix build $1 failed or timed out (try $try)"
            done
            return 1
          }
          build "github:AeneasVerif/aeneas/$AENEAS_REV" "$RUNNER_TEMP/aeneas"
          build "github:AeneasVerif/aeneas/$AENEAS_REV#charon" "$RUNNER_TEMP/charon"
          echo "$RUNNER_TEMP/aeneas/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/charon/bin" >> "$GITHUB_PATH"
      - run: target/release/h5i-app-xtask extract --check --all crates examples/app examples/embedded
