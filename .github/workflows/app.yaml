# h5i-app: the verifiable application framework (crates/h5i-app*), its
# examples (examples/app, a separate Cargo workspace) and their Lean proofs.
# Kept apart from test.yaml so a change to the framework does not pay for a
# browser-engine build, and a change to h5i does not pay for Lean.
name: h5i-app

on:
  push:
    branches: [main]
    paths:
      - "crates/h5i-app*/**"
      - "examples/app/**"
      - "scripts/app/**"
      - "deny.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/app.yaml"
  pull_request:
    paths:
      - "crates/h5i-app*/**"
      - "examples/app/**"
      - "scripts/app/**"
      - "deny.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/app.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in sync with crates/h5i-app-cli/src/pins.rs, whose test checks every
  # lakefile against it.
  AENEAS_REV: b86120db3183b0107eb5f2637b11c424cd06ef1c

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: h5i
          POSTGRES_PASSWORD: h5i
          POSTGRES_DB: h5i
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U h5i"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      H5I_APP_TEST_DATABASE_URL: postgres://h5i:h5i@127.0.0.1:5432/h5i
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/app
      # Only the h5i-app packages: the rest of the root workspace is the h5i
      # CLI, which test.yaml builds.
      - run: cargo build -p 'h5i-app*' --all-features --all-targets --locked
      - run: cargo build --workspace --all-targets --locked
        working-directory: examples/app
      - run: scripts/app/ci-rust-tests.sh
      # Routes take an Actor; no client-set identity in a Command.
      - run: cargo app lint --all crates examples/app
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # A8: only h5i-app-pg may depend on database drivers.
      - run: cargo deny check bans
      - run: cargo deny check bans
        working-directory: examples/app

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: examples/app/docs/proofs/.lake
          key: lake-${{ hashFiles('examples/app/docs/proofs/lake-manifest.json', 'examples/app/docs/proofs/lean-toolchain', 'examples/app/docs/proofs/lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ hashFiles('examples/app/docs/proofs/lake-manifest.json', 'examples/app/docs/proofs/lean-toolchain', 'examples/app/docs/proofs/lakefile.lean') }}-
      - run: lake exe cache get
        working-directory: examples/app/docs/proofs
      # Every proof project shares the docs project's pinned Aeneas packages.
      - name: Share the Lake packages
        run: |
          for m in $(find crates examples/app -name h5i-app.toml -not -path '*/target/*'); do
            d="$(dirname "$m")/proofs"
            [ "$d" = examples/app/docs/proofs ] && continue
            mkdir -p "$d/.lake"
            ln -sfn "$GITHUB_WORKSPACE/examples/app/docs/proofs/.lake/packages" "$d/.lake/packages"
          done
      # Build every proof project and gate it: no sorry, native_decide or
      # axiom, every theorem of a hand-written module on the standard axioms
      # only, and the theorems each h5i-app.toml names present.
      - run: cargo app check --all crates examples/app
  # A9: the committed Lean must be exactly what Aeneas extracts from the kernel.
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Before Nix puts Charon's toolchain on PATH.
      - run: cargo build --release --locked -p h5i-app-xtask
      - uses: cachix/install-nix-action@v31
        with:
          # Aeneas CI pushes its builds here.
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build Charon and Aeneas at the pinned commit
        run: |
          nix build "github:AeneasVerif/aeneas/$AENEAS_REV" -o "$RUNNER_TEMP/aeneas" -L
          nix build "github:AeneasVerif/aeneas/$AENEAS_REV#charon" -o "$RUNNER_TEMP/charon" -L
          echo "$RUNNER_TEMP/aeneas/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/charon/bin" >> "$GITHUB_PATH"
      - run: target/release/h5i-app-xtask extract --check --all crates examples/app
