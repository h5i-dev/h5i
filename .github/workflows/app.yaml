# h5i-app: the verifiable application framework (crates/h5i-app*), its
# examples (examples/app, a separate Cargo workspace) and their Lean proofs.
# Kept apart from test.yaml so a change to the framework does not pay for a
# browser-engine build, and a change to h5i does not pay for Lean.
name: h5i-app

on:
  push:
    branches: [main]
    paths:
      - "crates/h5i-app*/**"
      - "examples/app/**"
      - "examples/embedded/**"
      - "scripts/app/**"
      - "deny.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/app.yaml"
  pull_request:
    paths:
      - "crates/h5i-app*/**"
      - "examples/app/**"
      - "examples/embedded/**"
      - "scripts/app/**"
      - "deny.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/app.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in sync with crates/h5i-app-cli/src/pins.rs, whose test checks every
  # lakefile against it.
  AENEAS_REV: b86120db3183b0107eb5f2637b11c424cd06ef1c

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: h5i
          POSTGRES_PASSWORD: h5i
          POSTGRES_DB: h5i
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U h5i"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      H5I_APP_TEST_DATABASE_URL: postgres://h5i:h5i@127.0.0.1:5432/h5i
      # The service's own user is a superuser: h5i-app-pg's fault tests
      # terminate backends and read every backend's locks with it.
      H5I_APP_TEST_ADMIN_URL: postgres://h5i:h5i@127.0.0.1:5432/h5i
      # A database test whose URL is missing fails instead of skipping.
      H5I_APP_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/app
      # Only the h5i-app packages: the rest of the root workspace is the h5i
      # CLI, which test.yaml builds.
      - run: cargo build -p 'h5i-app*' --all-features --all-targets --locked
      - run: cargo build --workspace --all-targets --locked
        working-directory: examples/app
      # The embedded examples: host workspace, then the firmware for Cortex-M.
      - run: cargo test --workspace --locked
        working-directory: examples/embedded
      - run: rustup target add thumbv7em-none-eabihf
      - run: cargo build -p h5i-app-h1 -p h5i-app-embedded --target thumbv7em-none-eabihf --locked
      - run: cargo build --release --locked
        working-directory: examples/embedded/thermostat/firmware
      # A TLS-only PostgreSQL for h5i-app-pg's `tls` tests.
      - run: scripts/app/pg-tls.sh "$RUNNER_TEMP/pg-tls" >> "$GITHUB_ENV"
      - run: scripts/app/ci-rust-tests.sh
      # A6: restart the service container under load; the same process must
      # recover. Last, since it restarts the database the other tests use.
      - run: scripts/app/ci-restart-test.sh
        env:
          H5I_APP_TEST_RESTART_CMD: docker restart ${{ job.services.postgres.id }}
      # Routes take an Actor; no client-set identity in a Command.
      - run: cargo app lint --all crates examples/app examples/embedded
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # A8: only h5i-app-pg may depend on database drivers.
      - run: cargo deny check bans
      - run: cargo deny check bans
        working-directory: examples/app

  # Every proof project, split into shards that run in parallel (about 5 to
  # 10 minutes each). `ci-shard.sh` partitions what `--all` finds, so a new
  # project is checked without editing this file.
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install elan and the pinned Lean toolchain
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # Up front, with a few spaced retries: a transient 504 from the
          # release server then fails or recovers here, once, instead of in
          # every project's `lake build`.
          for tc in $(cat $(git ls-files '*proofs/lean-toolchain') | sort -u); do
            for try in 1 2 3; do
              "$HOME/.elan/bin/elan" toolchain install "$tc" && break
              [ "$try" = 3 ] && exit 1
              sleep $((try * 30))
            done
          done
      # `h5i app check` fetches the Lake packages (Aeneas, Mathlib) once into
      # this cache, shared by every proof project with the same requires.
      # Every shard restores it; only shard 0 saves it, so one run uploads it
      # at most once.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/h5i/lake
          key: lake-${{ hashFiles('**/proofs/lean-toolchain', '**/proofs/lakefile.lean', '**/proofs/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ hashFiles('**/proofs/lean-toolchain', '**/proofs/lakefile.lean', '**/proofs/lake-manifest.json') }}-
      - run: cargo build --release --locked -p h5i-app-xtask
      # An `[authz]` project's check re-extracts it (its gate is only about
      # the kernel when proofs/generated/ is fresh), so it needs both tools.
      - name: Install Charon and Aeneas at the pinned commit
        timeout-minutes: 5
        run: scripts/app/install-aeneas.sh "$RUNNER_TEMP/aeneas" >> "$GITHUB_PATH"
      # Build each project of the shard and gate it: no sorry, native_decide
      # or axiom, every theorem of a hand-written module on the standard
      # axioms only, and the theorems each h5i-app.toml names present.
      - name: Check this shard's proof projects
        run: |
          projects=$(scripts/app/ci-shard.sh ${{ matrix.shard }} 4 crates examples/app examples/embedded)
          echo "$projects"
          target/release/h5i-app-xtask check $projects
      - uses: actions/cache/save@v4
        if: matrix.shard == 0 && success()
        with:
          path: ~/.cache/h5i/lake
          key: lake-${{ hashFiles('**/proofs/lean-toolchain', '**/proofs/lakefile.lean', '**/proofs/lake-manifest.json') }}-${{ github.sha }}
  # A9: the committed Lean must be exactly what Aeneas extracts from the kernel.
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p h5i-app-xtask
      - name: Install Charon and Aeneas at the pinned commit
        timeout-minutes: 5
        run: scripts/app/install-aeneas.sh "$RUNNER_TEMP/aeneas" >> "$GITHUB_PATH"
      - run: target/release/h5i-app-xtask extract --check --all crates examples/app examples/embedded
