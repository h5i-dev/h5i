# h5i-app: the verifiable application framework (crates/h5i-app*), its
# examples (examples/app, a separate Cargo workspace) and their Lean proofs.
# Kept apart from test.yaml so a change to the framework does not pay for a
# browser-engine build, and a change to h5i does not pay for Lean.
name: h5i-app

on:
  push:
    branches: [main]
    paths:
      - "crates/h5i-app*/**"
      - "examples/app/**"
      - "scripts/app/**"
      - "deny.toml"
      - "Cargo.lock"
      - ".github/workflows/app.yaml"
  pull_request:
    paths:
      - "crates/h5i-app*/**"
      - "examples/app/**"
      - "scripts/app/**"
      - "deny.toml"
      - "Cargo.lock"
      - ".github/workflows/app.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in sync with examples/app/docs/proofs/lakefile.lean.
  AENEAS_REV: b86120db3183b0107eb5f2637b11c424cd06ef1c

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: h5i
          POSTGRES_PASSWORD: h5i
          POSTGRES_DB: h5i
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U h5i"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      H5I_APP_TEST_DATABASE_URL: postgres://h5i:h5i@127.0.0.1:5432/h5i
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/app
      # Only the h5i-app packages: the rest of the root workspace is the h5i
      # CLI, which test.yaml builds.
      - run: cargo build -p 'h5i-app*' --all-features --all-targets --locked
      - run: cargo build --workspace --all-targets --locked
        working-directory: examples/app
      - run: scripts/app/ci-rust-tests.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # A8: only h5i-app-pg may depend on database drivers.
      - run: cargo deny check bans
      - run: cargo deny check bans
        working-directory: examples/app

  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/app/docs/proofs
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: examples/app/docs/proofs/.lake
          key: lake-${{ hashFiles('examples/app/docs/proofs/lake-manifest.json', 'examples/app/docs/proofs/lean-toolchain', 'examples/app/docs/proofs/lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ hashFiles('examples/app/docs/proofs/lake-manifest.json', 'examples/app/docs/proofs/lean-toolchain', 'examples/app/docs/proofs/lakefile.lean') }}-
      - run: lake exe cache get
      - run: lake build
      # No sorry, no native_decide, only standard axioms.
      - run: ../../../../scripts/app/ci-lean-gate.sh
      # These projects share the docs project's pinned Aeneas packages.
      - name: Build the other extracted-crate proofs
        working-directory: .
        run: |
          for d in crates/h5i-app-sql/proofs crates/h5i-app-pgsql/proofs crates/h5i-app-token/proofs crates/h5i-app-json/proofs examples/app/kellnr/proofs examples/app/atuin/proofs examples/app/tutorials/calculator/proofs examples/app/tutorials/board/proofs examples/app/wastebin/proofs examples/app/conduit/proofs examples/app/cratesio/proofs examples/app/tutorials/ledger/proofs examples/app/tutorials/inbox/proofs examples/app/tutorials/booking/proofs examples/app/filters/proofs examples/app/keys/proofs; do
            mkdir -p "$d/.lake"
            ln -sfn "$GITHUB_WORKSPACE/examples/app/docs/proofs/.lake/packages" "$d/.lake/packages"
            (cd "$d" && lake build)
            if grep -n -w -e sorry -e native_decide "$d"/*.lean; then exit 1; fi
            if grep -n "^axiom" "$d"/*.lean "$d"/generated/*.lean; then exit 1; fi
          done
      # The SQL compiler and every server's database invariant: standard axioms only.
      - name: Axioms of the database theorems
        working-directory: .
        run: scripts/app/ci-db-axioms.sh
  # A9: the committed Lean must be exactly what Aeneas extracts from the kernel.
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          # Aeneas CI pushes its builds here.
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build Charon and Aeneas at the pinned commit
        run: |
          nix build "github:AeneasVerif/aeneas/$AENEAS_REV" -o "$RUNNER_TEMP/aeneas" -L
          nix build "github:AeneasVerif/aeneas/$AENEAS_REV#charon" -o "$RUNNER_TEMP/charon" -L
          echo "$RUNNER_TEMP/aeneas/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/charon/bin" >> "$GITHUB_PATH"
      - run: scripts/app/extract.sh
      - run: scripts/app/extract-sql.sh
      - run: scripts/app/extract-pgsql.sh
      - run: scripts/app/extract-token.sh
      - run: scripts/app/extract-json.sh
      - run: scripts/app/extract-kellnr.sh
      - run: scripts/app/extract-atuin.sh
      - run: scripts/app/extract-calculator.sh
      - run: scripts/app/extract-board.sh
      - run: scripts/app/extract-wastebin.sh
      - run: scripts/app/extract-conduit.sh
      - run: scripts/app/extract-cratesio.sh
      - run: scripts/app/extract-ledger.sh
      - run: scripts/app/extract-inbox.sh
      - run: scripts/app/extract-booking.sh
      - run: scripts/app/extract-filters.sh
      - run: scripts/app/extract-keys.sh
      - run: |
          git diff --exit-code -- \
            examples/app/docs/proofs/generated/DocsKernel.lean \
            crates/h5i-app-sql/proofs/generated/H5iAppSql.lean \
            crates/h5i-app-pgsql/proofs/generated/H5iAppPgsql.lean \
            crates/h5i-app-token/proofs/generated/H5iAppToken.lean \
            crates/h5i-app-json/proofs/generated/H5iAppJson.lean \
            examples/app/kellnr/proofs/generated/KellnrKernel.lean \
            examples/app/atuin/proofs/generated/AtuinKernel.lean \
            examples/app/tutorials/calculator/proofs/generated/CalculatorKernel.lean \
            examples/app/tutorials/board/proofs/generated/BoardKernel.lean \
            examples/app/wastebin/proofs/generated/WastebinKernel.lean \
            examples/app/conduit/proofs/generated/ConduitKernel.lean \
            examples/app/cratesio/proofs/generated/CratesioKernel.lean \
            examples/app/tutorials/ledger/proofs/generated/LedgerKernel.lean \
            examples/app/tutorials/inbox/proofs/generated/InboxKernel.lean \
            examples/app/tutorials/booking/proofs/generated/BookingKernel.lean \
            examples/app/filters/proofs/generated/FiltersKernel.lean \
            examples/app/keys/proofs/generated/KeysKernel.lean
