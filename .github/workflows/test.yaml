name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    # Run on PRs against any base branch so feature branches get checked.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# One in-flight run per branch. Pushing a fix ten seconds after a typo should
# not leave the first run burning a macOS runner for twenty minutes; `main` is
# exempt so a merge is never cancelled by the merge behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    # Every job is bounded. A test that deadlocks (this repo spawns sandboxed
    # children, servers and worktrees) would otherwise hold a runner for the
    # six-hour default before anyone learns anything.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set Git user for tests
        # Required because some tests perform real Git operations
        # (commit / blame / log) and libgit2 needs author + committer.
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # NB: rustfmt enforcement deferred — codebase is not yet fmt-clean.
          # See https://github.com/h5i-dev/h5i/issues for the cleanup tracker.

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The one job that builds the `h5i ui` console for real. Done as its own
      # step rather than left to h5i-core's build script so a TypeScript error
      # is reported as a frontend failure instead of a confusing cargo one —
      # and so every cargo step below finds a fresh web/dist and skips npm.
      # `npm ci` (not `install`) is itself a gate: it refuses to run when
      # package-lock.json disagrees with package.json, so a dependency bump that
      # forgot the lockfile fails here instead of resolving to something nobody
      # reviewed.
      - name: The lockfile covers this runner's platform
        working-directory: web
        run: node ../scripts/check-lockfile-platforms.mjs

      - name: Build the console bundle
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # `--locked` throughout: Cargo.lock is committed and the release build
      # uses it, so a manifest change that never updated the lockfile has to
      # fail on a PR rather than surface at tag time.
      # h5i-browser-light depends on boa by git revision because no published
      # version can coexist with blitz's parley. That is a thing to undo, not to keep,
      # and "it is on the list" is how a temporary patch becomes permanent — so
      # the question is asked here rather than remembered. Fails the day a
      # usable release exists, and is quiet until then.
      - name: A published boa would still not work (so the patch stays)
        run: ./scripts/check_boa_release.sh

      - name: cargo clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --locked --verbose --workspace --all-targets

      # Includes tests/console_api.rs, which spawns the binary and speaks HTTP
      # to it — the only place CI finds out whether the console's routes, gate
      # and embedded bundle actually work.
      - name: cargo test
        run: cargo test --locked --verbose --workspace

      # The library must still compile without the console: `web` is a default
      # feature, so nothing else in CI would notice it rotting.
      - name: cargo clippy (no console)
        env:
          H5I_SKIP_WEB_BUILD: "1"
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

  # macOS confines with Seatbelt, not Landlock/seccomp, so the kernel tiers there
  # are a genuinely different code path (crates/h5i-sandbox/src/seatbelt.rs). The
  # cross-check job below only proves it *compiles*; this one runs it, which is
  # the only way the SBPL profiles are shown to actually confine anything. Kept
  # separate from the Linux job so a macOS-runner outage never blocks a PR on a
  # platform the change did not touch.
  macos:
    name: build · test · clippy (macOS / Seatbelt)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set Git user for tests
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Seatbelt is present on the runner
        # If this fails, every kernel-tier test below will fail-closed rather
        # than silently pass at the workspace tier — surface the cause here.
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1)(deny default)(allow file-read*)(allow process-exec*)(allow process-fork)(allow sysctl-read)(allow mach-lookup)(allow signal (target self))' /usr/bin/true

      # --all-targets so the integration tests are *compiled* here even though
      # they are not run below: compile breakage on macOS should fail loudly.
      #
      # H5I_SKIP_WEB_BUILD: this job proves the Rust compiles on Darwin, and the
      # console bundle is byte-identical whatever host built it. The build
      # script leaves a stub behind so `rust-embed` still resolves; the Linux
      # job above is where the real bundle is built.
      - name: cargo clippy (deny warnings)
        env:
          H5I_SKIP_WEB_BUILD: "1"
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Unit tests only, deliberately. `tests/env_integration.rs` asserts Linux
      # kernel behaviour directly — that `unshare` is refused by the seccomp
      # deny-list, that `/proc/<pid>/environ` of a host process is unreachable
      # from the PID namespace, that Landlock is what denied a write. None of
      # those mechanisms exist on Darwin, so running that suite here would
      # report failures that mean nothing about the macOS backend. The Seatbelt
      # tier's own behaviour is covered by the h5i-sandbox unit tests (the
      # `seatbelt` module), which do run.
      #
      # Porting the integration suite to assert per-platform is real work and
      # wants someone iterating on a Mac; it is not silently skipped, it is
      # scoped out here on purpose.
      - name: cargo test (unit)
        env:
          H5I_SKIP_WEB_BUILD: "1"
        run: cargo test --locked --verbose --workspace --lib

  # The man page (man/man1/h5i.1) and the /manual/ HTML (docs/manual/index.html)
  # are GENERATED, not hand-edited: the man page from the clap CLI via
  # `scripts/gen_man.sh`, the HTML from MANUAL.md via `scripts/gen_manual.py`.
  # This job regenerates both and fails if the committed copies drift, so a
  # change to the CLI flags or to MANUAL.md can never land with a stale manual.
  # Reproducibility: the man page is pinned by Cargo.lock (`--locked` build) +
  # toolchain; the HTML is pinned by `scripts/requirements.txt` (the `markdown`
  # version). Regenerate locally on Linux with the same pins and commit the diff.
  # The light engine's conformance number, defended.
  #
  # ROADMAP_BROWSER §12 quotes a WPT pass count, and every point of it was paid
  # for by a specific change. Any of them can be given back silently by an
  # unrelated one — the settle-loop rewrite in this branch cost 3,142 subtests
  # in `html` before anyone looked — so the count is committed as a floor and
  # checked.
  #
  # A subset, not the suite: all of WPT is a 2 GiB checkout and forty minutes,
  # and a gate nobody can afford to run is not a gate. These five directories
  # are the ones this engine's own work moves, so a change that breaks the
  # engine has to break one of them.
  #
  # Gated on the *pass count* rather than a percentage: the denominator moves
  # when upstream adds tests or the harness reaches further, and a percentage
  # that falls because the denominator grew is not a regression.
  wpt:
    name: WPT (no regression against the committed floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Sparse: the five gate directories plus the machinery every test loads.
      # `interfaces/` is not a test directory but `idlharness` fetches its IDL,
      # and without it 211 endpoints hang on a file that never arrives.
      - name: Check out the Web Platform Tests (sparse)
        uses: actions/checkout@v7
        with:
          repository: web-platform-tests/wpt
          path: wpt-checkout
          sparse-checkout: |
            resources
            common
            interfaces
            dom
            css/cssom
            html/dom
            domparsing
            encoding

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the engine
        run: cargo build --locked --release -p h5i-browser-light

      - name: Run the gate
        env:
          WPT_ROOT: ${{ github.workspace }}/wpt-checkout
        run: crates/h5i-browser-light/wpt/gate.sh

  docs:
    name: docs fresh (man + html + install.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # `docs/install.sh` is what `curl -fsSL https://h5i.dev/install.sh | sh`
      # fetches, and `docs/` is published verbatim, so the site needs a real
      # copy of the file rather than a pointer to one. Two copies of a script
      # people pipe into a shell is exactly what drifts in silence: the root
      # file gets the fix, the published one keeps installing the old way, and
      # nothing says so.
      #
      # A symlink would avoid the second copy and is rejected on purpose. It
      # would work only because `upload-pages-artifact` happens to tar with
      # `--dereference` today, which is an implementation detail of someone
      # else's action, and the day it changes the install URL 404s.
      #
      # First step in the job because it needs no toolchain: a stale manual
      # below should not hide this, and this should not wait on a Rust build.
      - name: The published install.sh matches the repository's
        run: |
          if cmp -s install.sh docs/install.sh; then
            echo "docs/install.sh is in sync"
            exit 0
          fi
          echo "::error::install.sh and docs/install.sh have diverged — h5i.dev would serve the stale one."
          echo "Copy the root file over the published one, then commit it:"
          echo "    cp install.sh docs/install.sh"
          echo "----------------------------- drift -----------------------------"
          diff -u install.sh docs/install.sh || true
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # An explicit interpreter rather than the runner's system Python. Two
      # reasons, both about this job's byte-exact diff: a distro Python marked
      # externally-managed (PEP 668) makes `pip install` fail outright, and a
      # runner-image Python bump would silently become an input to generated
      # HTML that is compared byte for byte. 3.12 matches what the committed
      # page was generated with.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install manual-generator deps (pinned)
        run: python3 -m pip install --quiet -r scripts/requirements.txt

      # Default features stay ON so the page lists `h5i ui`, matching the
      # committed one. The man page derives from the clap command tree alone,
      # so the bundle's contents cannot affect it — skip the npm build and let
      # the build script leave its stub.
      - name: Regenerate the man page (from the clap CLI)
        env:
          H5I_SKIP_WEB_BUILD: "1"
        run: ./scripts/gen_man.sh

      - name: Regenerate the /manual/ HTML (from MANUAL.md)
        run: python3 scripts/gen_manual.py

      - name: Fail if the committed manuals are stale
        run: |
          if git diff --quiet -- man/man1/h5i.1 docs/manual/index.html; then
            echo "manuals are up to date"
            exit 0
          fi
          echo "::error::Generated manuals are out of date — a source change landed without regenerating."
          echo "Run on Linux, then commit the result:"
          echo "    ./scripts/gen_man.sh"
          echo "    python3 -m pip install -r scripts/requirements.txt && python3 scripts/gen_manual.py"
          echo "    git add man/man1/h5i.1 docs/manual/index.html"
          echo "----------------------------- drift -----------------------------"
          git --no-pager diff -- man/man1/h5i.1 docs/manual/index.html
          exit 1

  # Compile-check every release target on PRs/main so cross-target breakage
  # (musl-vs-glibc libc cfg, arch-specific syscall consts, `target_os` gaps) is
  # caught BEFORE a tag is cut — not in `release.yaml`, which only runs on tags.
  # `cargo check` (not a full build) is enough: every such failure is a
  # front-end compile/type/cfg error. Keep this matrix in sync with
  # `release.yaml`'s build matrix.
  cross-check:
    name: cross-check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl linker/compiler for the native musl target; OpenSSL is vendored.
      - name: Install musl-tools (Linux, native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update -q && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      # Compile-only, so the console bundle is irrelevant: skip the npm build
      # (the build script stubs web/dist so `rust-embed` still resolves) rather
      # than put Node on four more runners.
      - name: cargo check (native)
        if: "!matrix.use_cross"
        env:
          H5I_SKIP_WEB_BUILD: "1"
        run: cargo check --locked --target ${{ matrix.target }}

      - name: cross check (container)
        if: matrix.use_cross
        env:
          H5I_SKIP_WEB_BUILD: "1"
          # Forward both into cross's Docker container: no Node in there, and
          # keep the `-D warnings` RUSTFLAGS from the workflow env.
          CROSS_CONTAINER_OPTS: '-e H5I_SKIP_WEB_BUILD -e RUSTFLAGS'
        run: cross check --locked --target ${{ matrix.target }}
