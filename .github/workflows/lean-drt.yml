name: Lean DRT

# The formal-verification lane (ROADMAP.md §V4): build the Lean model of the
# effective-config computation and differentially test it against the Rust
# implementation over generated policies. A separate, deliberately non-gating
# workflow while it earns trust; it gates once it has been quiet for a while
# (§V4). Rust contributors without a Lean toolchain are unaffected — the
# harness skips locally when the model binary is absent, and only this job
# sets H5I_DRT_REQUIRE.

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  drt:
    name: lean build · theorems · differential test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}

      # `lake build` compiles the model AND checks every theorem — a broken
      # proof fails here, before the differential test runs.
      - name: Build the Lean model (checks the theorems)
        working-directory: lean
        run: lake build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the DRT harness
        env:
          H5I_DRT_REQUIRE: "1"
          H5I_SKIP_WEB_BUILD: "1"
          H5I_DRT_CASES: "5000"
        run: cargo test --test effective_drt --test seatbelt_drt -- --nocapture

      # Model-versus-kernel: the Lean model predicts what a real box must
      # allow and deny, and the probes hold the kernel to it. Skips loudly
      # on runners that cannot run the process tier (hardened runners deny
      # unprivileged userns); the Lean binary itself is still required.
      - name: Run the conformance probes
        env:
          H5I_DRT_REQUIRE: "1"
          H5I_SKIP_WEB_BUILD: "1"
        run: cargo test --test effective_probes -- --nocapture
