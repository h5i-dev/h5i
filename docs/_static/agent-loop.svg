<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="The h5i loop: browse, contain, work, export. Each step writes down what it did, and the export step is the only way anything reaches your repository.">
<rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
<defs><marker id="lp-a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#9aa5b1"/></marker>
<marker id="lp-g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2e7d32"/></marker></defs>

<text x="400" y="40" font-size="21" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">The loop, and what each step writes down</text>
<text x="400" y="65" font-size="12.5" fill="#52606d" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">browse, contain, work, export. Nothing reaches your repository except through the last one.</text>

<rect x="32" y="92" width="170" height="104" rx="10" fill="#edf7f6" stroke="#16837a" stroke-width="2"/>
<text x="117" y="118" font-size="13" font-weight="700" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">1 · Browse</text>
<text x="117" y="145" font-size="11" fill="#0f5d56" text-anchor="middle" font-family="Consolas, Menlo, monospace">h5i browser open</text>
<text x="117" y="169" font-size="11" fill="#254f4b" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the engine is the</text>
<text x="117" y="184" font-size="11" fill="#254f4b" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">HTTP client</text>

<rect x="220" y="92" width="170" height="104" rx="10" fill="#ebf3ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="305" y="118" font-size="13" font-weight="700" fill="#2c5282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">2 · Contain</text>
<text x="305" y="145" font-size="11" fill="#2c5282" text-anchor="middle" font-family="Consolas, Menlo, monospace">h5i box .</text>
<text x="305" y="169" font-size="11" fill="#2c5282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">policy resolved</text>
<text x="305" y="184" font-size="11" fill="#2c5282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">before any state</text>

<rect x="408" y="92" width="170" height="104" rx="10" fill="#ebf3ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="493" y="118" font-size="13" font-weight="700" fill="#2c5282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">3 · Work</text>
<text x="493" y="145" font-size="11" fill="#2c5282" text-anchor="middle" font-family="Consolas, Menlo, monospace">h5i box shell</text>
<text x="493" y="169" font-size="11" fill="#2c5282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the process tree</text>
<text x="493" y="184" font-size="11" fill="#2c5282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">inherits the boundary</text>

<rect x="596" y="92" width="170" height="104" rx="10" fill="#eafaf1" stroke="#2e7d32" stroke-width="2"/>
<text x="681" y="118" font-size="13" font-weight="700" fill="#1e4620" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">4 · Export</text>
<text x="681" y="145" font-size="11" fill="#1e4620" text-anchor="middle" font-family="Consolas, Menlo, monospace">h5i box export</text>
<text x="681" y="169" font-size="11" fill="#1e4620" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the only door,</text>
<text x="681" y="184" font-size="11" fill="#1e4620" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">and a person opens it</text>

<line x1="205" y1="144" x2="217" y2="144" stroke="#9aa5b1" stroke-width="2.5" marker-end="url(#lp-a)"/>
<line x1="393" y1="144" x2="405" y2="144" stroke="#9aa5b1" stroke-width="2.5" marker-end="url(#lp-a)"/>
<line x1="581" y1="144" x2="593" y2="144" stroke="#9aa5b1" stroke-width="2.5" marker-end="url(#lp-a)"/>

<text x="400" y="234" font-size="10.5" font-weight="700" fill="#718096" text-anchor="middle" letter-spacing="1.2" font-family="Segoe UI, Helvetica, Arial, sans-serif">WHAT THE STEP LEAVES BEHIND</text>

<rect x="32" y="246" width="170" height="56" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="117" y="270" font-size="11" fill="#3e4c59" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">a request log</text>
<text x="117" y="288" font-size="11" fill="#3e4c59" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">written before the wire</text>

<rect x="220" y="246" width="170" height="56" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="305" y="270" font-size="11" fill="#3e4c59" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">a policy digest and</text>
<text x="305" y="288" font-size="11" fill="#3e4c59" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">a pinned base revision</text>

<rect x="408" y="246" width="170" height="56" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="493" y="270" font-size="11" fill="#3e4c59" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">every command,</text>
<text x="493" y="288" font-size="11" fill="#3e4c59" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">lane and exit code</text>

<rect x="596" y="246" width="170" height="56" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="681" y="270" font-size="11" fill="#3e4c59" text-anchor="middle" font-family="Consolas, Menlo, monospace">patch.diff report.md</text>
<text x="681" y="288" font-size="11" fill="#3e4c59" text-anchor="middle" font-family="Consolas, Menlo, monospace">receipt.json</text>

<line x1="681" y1="302" x2="681" y2="336" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#lp-g)"/>

<rect x="32" y="344" width="736" height="62" rx="10" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
<text x="56" y="371" font-size="12.5" font-weight="700" fill="#7b4d12" font-family="Segoe UI, Helvetica, Arial, sans-serif">The output gate</text>
<text x="56" y="392" font-size="12" fill="#7b4d12" font-family="Segoe UI, Helvetica, Arial, sans-serif">A person reads report.md, denied egress first, then runs git apply --3way. The box cannot write across this line.</text>
</svg>
