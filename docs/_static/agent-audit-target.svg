<circle cx="789" cy="207.5" r="4" fill="#ededf0"/>
<text x="804" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#ededf0">I&#x27;ll open a capturing session and map the surface first.</text>
<circle cx="789" cy="234.5" r="4" fill="#6a9955"/>
<text x="804" y="239" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13"><tspan fill="#ededf0" font-weight="600">Bash</tspan><tspan fill="#75757f">(</tspan><tspan fill="#ff6258">h5i </tspan><tspan fill="#dcdcaa">browser open </tspan><tspan fill="#a8a8b2">https://target.com </tspan><tspan fill="#9cdcfe">--capture</tspan><tspan fill="#75757f">)</tspan></text>
<text x="804" y="260" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5"><tspan fill="#4e4e57">⎿  </tspan><tspan fill="#a8a8b2">session br_7k2xqa · logged in as alice · capturing</tspan></text>
<circle cx="789" cy="282.5" r="4" fill="#6a9955"/>
<text x="804" y="287" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13"><tspan fill="#ededf0" font-weight="600">Bash</tspan><tspan fill="#75757f">(</tspan><tspan fill="#ff6258">h5i </tspan><tspan fill="#dcdcaa">recon crawl </tspan><tspan fill="#9cdcfe">--max-requests </tspan><tspan fill="#4ec9b0">200 </tspan><tspan fill="#9cdcfe">--rate </tspan><tspan fill="#4ec9b0">4</tspan><tspan fill="#75757f">)</tspan></text>
<text x="804" y="308" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5"><tspan fill="#4e4e57">⎿  </tspan><tspan fill="#a8a8b2">38 endpoints · 4 take an object id</tspan></text>
<circle cx="789" cy="330.5" r="4" fill="#6a9955"/>
<text x="804" y="335" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13"><tspan fill="#ededf0" font-weight="600">Bash</tspan><tspan fill="#75757f">(</tspan><tspan fill="#ff6258">h5i </tspan><tspan fill="#dcdcaa">browser click </tspan><tspan fill="#c586c0">@e3</tspan><tspan fill="#75757f">)</tspan></text>
<text x="804" y="356" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5"><tspan fill="#4e4e57">⎿  </tspan><tspan fill="#a8a8b2">GET /api/orders?id=1041 → 200  req_42</tspan></text>
<circle cx="789" cy="378.5" r="4" fill="#ededf0"/>
<text x="804" y="383" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#ededf0">Order ids look sequential. Checking whether they are scoped to alice.</text>
<circle cx="789" cy="405.5" r="4" fill="#ff6258"/>
<text x="804" y="410" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13"><tspan fill="#ededf0" font-weight="600">Bash</tspan><tspan fill="#75757f">(</tspan><tspan fill="#ff6258">h5i </tspan><tspan fill="#dcdcaa">websec replay </tspan><tspan fill="#a8a8b2">req_42 </tspan><tspan fill="#9cdcfe">--set </tspan><tspan fill="#4ec9b0">query.id=1042</tspan><tspan fill="#75757f">)</tspan></text>
<text x="804" y="431" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5"><tspan fill="#4e4e57">⎿  </tspan><tspan fill="#ff6258">200 · owner bob@target.com  req_43</tspan></text>
<circle cx="789" cy="453.5" r="4" fill="#6a9955"/>
<text x="804" y="458" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13"><tspan fill="#ededf0" font-weight="600">Bash</tspan><tspan fill="#75757f">(</tspan><tspan fill="#ff6258">h5i </tspan><tspan fill="#dcdcaa">websec diff </tspan><tspan fill="#a8a8b2">res_42 res_43</tspan><tspan fill="#75757f">)</tspan></text>
<text x="804" y="479" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5"><tspan fill="#4e4e57">⎿  </tspan><tspan fill="#a8a8b2">owner, address, items, total differ</tspan></text>
<circle cx="789" cy="501.5" r="4" fill="#6a9955"/>
<text x="804" y="506" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13"><tspan fill="#ededf0" font-weight="600">Bash</tspan><tspan fill="#75757f">(</tspan><tspan fill="#ff6258">h5i </tspan><tspan fill="#dcdcaa">websec finding create </tspan><tspan fill="#9cdcfe">--title </tspan><tspan fill="#ce9178">&#x27;IDOR on /api/orders&#x27;</tspan></text>
<text x="804" y="527" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13"><tspan fill="#a8a8b2">      </tspan><tspan fill="#9cdcfe">--evidence </tspan><tspan fill="#a8a8b2">req_42,res_43</tspan><tspan fill="#75757f">)</tspan></text>
<text x="804" y="548" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5"><tspan fill="#4e4e57">⎿  </tspan><tspan fill="#a8a8b2">fnd_01 · high · evidence linked</tspan></text>
