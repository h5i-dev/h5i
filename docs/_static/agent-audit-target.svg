<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
<title id="title">An agent auditing target.com with h5i</title>
<desc id="desc">Dark two-panel illustration. On the left, the target web app in a browser: an order page for alice with a View invoice button tagged @e3, and a capture strip listing the requests h5i recorded, including a replayed request that returned another user's order. On the right, a coding agent harness: the prompt "Audit target.com with h5i", followed by h5i commands that open a capturing browser, crawl, click @e3, replay the order request with a different id, diff the responses, and file an IDOR finding.</desc>
