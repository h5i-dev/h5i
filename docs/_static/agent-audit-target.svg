<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
<title id="title">An agent auditing target.com with h5i</title>
<desc id="desc">Dark illustration of two windows. On the left, a browser on target.com showing alice's order page, with a View invoice button tagged @e3 and a strip of the requests h5i captured, including a replayed request that returned bob's order. On the right, a terminal running a coding agent: the prompt "Audit target.com with h5i", followed by h5i commands that open a capturing browser, crawl, click @e3, replay the order request with another id, diff the responses, and file an IDOR finding.</desc>
