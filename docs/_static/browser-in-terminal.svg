<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="h5i box view --term draws the box's page in the terminal, with the status row the page can never reach">
<rect width="800" height="470" fill="#ffffff"/>
<defs>
<marker id="tv-blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b6cb0"/></marker>
<marker id="tv-amber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b7791f"/></marker>
</defs>

<text x="400" y="36" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">h5i box view --term</text>
<text x="400" y="60" font-size="12.5" fill="#52606d" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">nothing is bound, so there is nothing to authenticate</text>

<!-- box -->
<rect x="26" y="86" width="212" height="196" rx="9" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
<text x="132" y="110" font-size="13.5" font-weight="700" fill="#8a5a12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the box</text>
<text x="132" y="130" font-size="11" fill="#6b4e16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">private network namespace</text>
<rect x="46" y="142" width="172" height="54" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="132" y="162" font-size="11.5" fill="#6b4e16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Chrome, fresh profile</text>
<text x="132" y="181" font-size="11.5" fill="#6b4e16" text-anchor="middle" font-family="Consolas, Menlo, monospace">agent-browser</text>
<rect x="46" y="206" width="172" height="54" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="132" y="226" font-size="11.5" fill="#6b4e16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">stream server</text>
<text x="132" y="245" font-size="11.5" fill="#6b4e16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">JPEG frames only</text>
<text x="132" y="274" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the port is never published</text>

<!-- h5i process -->
<rect x="268" y="86" width="214" height="196" rx="9" fill="#edf7f6" stroke="#16837a" stroke-width="2"/>
<text x="375" y="110" font-size="13.5" font-weight="700" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the command you typed</text>
<text x="375" y="132" font-size="11" fill="#254f4b" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">enters the netns by pid, gets the</text>
<text x="375" y="149" font-size="11" fill="#254f4b" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">socket back over SCM_RIGHTS</text>
<rect x="286" y="160" width="178" height="102" rx="6" fill="#ffffff" stroke="#16837a" stroke-width="1.2"/>
<text x="375" y="180" font-size="11.5" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">WebSocket client (hand cut)</text>
<text x="375" y="199" font-size="11.5" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">zune-jpeg decode, size capped</text>
<text x="375" y="218" font-size="11.5" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">scale to the cells it will occupy</text>
<text x="375" y="237" font-size="11.5" font-weight="700" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">h5i writes every escape byte</text>
<text x="375" y="255" font-size="11" fill="#254f4b" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Kitty graphics, q=2, t=d</text>

<!-- terminal -->
<rect x="512" y="86" width="262" height="196" rx="9" fill="#1a202c" stroke="#4a5568" stroke-width="2"/>
<rect x="524" y="98" width="238" height="22" rx="4" fill="#2f855a"/>
<text x="533" y="113" font-size="9.5" fill="#f0fff4" font-family="Consolas, Menlo, monospace">mybox  WATCH  agent  https://localhost:3000</text>
<rect x="524" y="128" width="238" height="140" rx="4" fill="#f7fafc"/>
<rect x="538" y="142" width="210" height="16" rx="3" fill="#cbd5e0"/>
<rect x="538" y="166" width="140" height="10" rx="3" fill="#e2e8f0"/>
<rect x="538" y="184" width="176" height="10" rx="3" fill="#e2e8f0"/>
<rect x="538" y="206" width="96" height="24" rx="4" fill="#2b6cb0"/>
<rect x="538" y="240" width="120" height="10" rx="3" fill="#e2e8f0"/>
<text x="643" y="298" font-size="11" fill="#2f855a" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">row one is h5i's: a page cannot draw on it</text>

<path d="M240,184 L266,184" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#tv-blue)"/>
<path d="M484,184 L510,184" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#tv-blue)"/>
<path d="M510,214 L486,214" stroke="#b7791f" stroke-width="2.5" marker-end="url(#tv-amber)"/>
<path d="M266,214 L242,214" stroke="#b7791f" stroke-width="2.5" marker-end="url(#tv-amber)"/>
<text x="375" y="300" font-size="10.5" fill="#b7791f" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">input flows back only while you hold the control lock</text>

<rect x="26" y="322" width="748" height="128" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="400" y="346" font-size="13" font-weight="700" fill="#2d3748" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Two modes, and what each one costs</text>
<text x="46" y="372" font-size="11.5" fill="#2d3748" font-family="Consolas, Menlo, monospace">WATCH</text>
<text x="130" y="372" font-size="11.5" fill="#4a5568" font-family="Segoe UI, Helvetica, Arial, sans-serif">read only. The mouse stays the terminal's, so selection and scrollback still work.</text>
<text x="46" y="396" font-size="11.5" fill="#2d3748" font-family="Consolas, Menlo, monospace">i  DRIVE</text>
<text x="130" y="396" font-size="11.5" fill="#4a5568" font-family="Segoe UI, Helvetica, Arial, sans-serif">takes the control lock. Mouse reporting on; the agent's mutating verbs are refused.</text>
<text x="46" y="420" font-size="11.5" fill="#2d3748" font-family="Consolas, Menlo, monospace">Ctrl-]</text>
<text x="130" y="420" font-size="11.5" fill="#4a5568" font-family="Segoe UI, Helvetica, Arial, sans-serif">hands control back. Every @ref the agent held is now stale, so it must re-snapshot.</text>
<text x="400" y="441" font-size="10.5" fill="#718096" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Honest limits: a terminal reports presses and not releases, so held keys do not work, and clicks land at cell resolution.</text>
</svg>
