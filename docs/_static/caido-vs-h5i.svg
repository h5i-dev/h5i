<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Caido workspace compared with an h5i bounded session</title><desc id="desc">Caido offers a proxy workspace with HTTPQL, Replay, Automate, workflows, and agent skills. h5i exposes browser, recon, and websec in a CLI session; a sandbox is optional.</desc><rect width="1200" height="630" fill="#0d0d0f"/><g font-family="Arial,sans-serif" fill="#eee"><text x="70" y="70" font-size="34" font-weight="700">Two agent-friendly workspaces</text><rect x="70" y="135" width="480" height="360" rx="24" fill="#202025" stroke="#777" stroke-width="3"/><text x="310" y="185" text-anchor="middle" font-size="28">Caido workspace</text><g font-size="21"><text x="115" y="250">HTTPQL search</text><text x="330" y="250">Replay</text><text x="115" y="325">Automate</text><text x="330" y="325">Workflows</text><text x="115" y="400">Proxy history</text><text x="330" y="400">Agent skills</text></g><rect x="650" y="135" width="480" height="360" rx="24" fill="#241719" stroke="#d21c1c" stroke-width="4"/><text x="890" y="185" text-anchor="middle" font-size="28">h5i CLI session</text><rect x="710" y="220" width="360" height="190" rx="18" fill="#35191d" stroke="#a33" stroke-width="2"/><text x="890" y="265" text-anchor="middle" font-size="22">browser · recon · websec</text><circle cx="890" cy="330" r="48" fill="#d21c1c"/><text x="890" y="338" text-anchor="middle" font-size="22">agent</text><text x="890" y="455" text-anchor="middle" font-size="21">request evidence for review</text><text x="310" y="545" text-anchor="middle" font-size="20">analyze and transform more traffic</text><text x="890" y="545" text-anchor="middle" font-size="20">optional isolated box</text><text x="600" y="600" text-anchor="middle" font-size="18" fill="#aaa">Caido has agent skills; h5i works directly from a terminal.</text></g></svg>
