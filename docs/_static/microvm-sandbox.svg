<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="The h5i microvm tier puts a hypervisor and a separate guest kernel between the agent and the host">
<rect width="800" height="470" fill="#ffffff"/>
<defs>
<marker id="mv-red" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c53030"/></marker>
<marker id="mv-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2e7d32"/></marker>
</defs>

<text x="400" y="38" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Where the boundary actually ends</text>
<text x="400" y="62" font-size="12.5" fill="#52606d" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the same box, the same image, one flag apart</text>

<!-- container column -->
<rect x="40" y="88" width="340" height="330" rx="10" fill="#fbfbfc" stroke="#a0aec0" stroke-width="1.5"/>
<text x="210" y="114" font-size="14" font-weight="700" fill="#4a5568" text-anchor="middle" font-family="Consolas, Menlo, monospace">isolation = container</text>

<rect x="66" y="130" width="288" height="52" rx="7" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
<text x="210" y="152" font-size="13" font-weight="700" fill="#8a5a12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">agent + toolchain + dev server</text>
<text x="210" y="171" font-size="11.5" fill="#6b4e16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">rootless Podman, read only rootfs</text>

<rect x="66" y="194" width="288" height="46" rx="7" fill="#edf2f7" stroke="#718096" stroke-width="1.5"/>
<text x="210" y="214" font-size="12" fill="#2d3748" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">CONNECT allowlist proxy (L7)</text>
<text x="210" y="231" font-size="11" fill="#c53030" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">a raw socket ignores it</text>

<rect x="66" y="252" width="288" height="46" rx="7" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
<text x="210" y="272" font-size="13" font-weight="700" fill="#9b2c2c" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">host kernel</text>
<text x="210" y="289" font-size="11" fill="#9b2c2c" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">shared with the box</text>

<rect x="66" y="310" width="288" height="42" rx="7" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
<text x="210" y="336" font-size="12.5" font-weight="700" fill="#2d3748" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">your host, your credentials</text>

<path d="M210,298 L210,308" stroke="#c53030" stroke-width="2.5" marker-end="url(#mv-red)"/>
<text x="210" y="378" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">a kernel exploit meets the kernel</text>
<text x="210" y="396" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">it just subverted</text>

<!-- microvm column -->
<rect x="420" y="88" width="340" height="330" rx="10" fill="#fbfbfc" stroke="#16837a" stroke-width="1.5"/>
<text x="590" y="114" font-size="14" font-weight="700" fill="#0f5d56" text-anchor="middle" font-family="Consolas, Menlo, monospace">isolation = microvm</text>

<rect x="446" y="130" width="288" height="52" rx="7" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
<text x="590" y="152" font-size="13" font-weight="700" fill="#8a5a12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">agent + toolchain + dev server</text>
<text x="590" y="171" font-size="11.5" fill="#6b4e16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">the same OCI image</text>

<rect x="446" y="194" width="288" height="46" rx="7" fill="#edf7f6" stroke="#16837a" stroke-width="1.5"/>
<text x="590" y="214" font-size="12" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">guest kernel + VM netstack (L3/L4)</text>
<text x="590" y="231" font-size="11" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">default deny, one rule per destination</text>

<rect x="446" y="252" width="288" height="46" rx="7" fill="#e6fffa" stroke="#0f5d56" stroke-width="2.5"/>
<text x="590" y="272" font-size="13" font-weight="700" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">hypervisor (KVM / Apple Silicon)</text>
<text x="590" y="289" font-size="11" fill="#0f5d56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">booted by msb from that image</text>

<rect x="446" y="310" width="288" height="42" rx="7" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
<text x="590" y="336" font-size="12.5" font-weight="700" fill="#2d3748" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">your host, your credentials</text>

<path d="M590,298 L590,308" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#mv-green)"/>
<text x="590" y="378" font-size="11.5" fill="#2e7d32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">a kernel exploit meets the hypervisor,</text>
<text x="590" y="396" font-size="11.5" fill="#2e7d32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">not the kernel it just subverted</text>

<rect x="40" y="430" width="720" height="28" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
<text x="400" y="449" font-size="11.5" fill="#4a5568" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">The cost, stated up front: no per request egress tally, no host loopback credential grants, and a VM has to boot.</text>
</svg>
