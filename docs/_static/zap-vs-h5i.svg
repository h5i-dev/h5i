<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">OWASP ZAP plan automation compared with the h5i agent loop</title><desc id="desc">ZAP can automate a configured scan plan or be driven through an API. h5i exposes browser observations and HTTP replay to a CLI agent for a directed investigation.</desc><rect width="1200" height="630" fill="#0d0d0f"/><g font-family="Arial,sans-serif" fill="#eee"><text x="70" y="70" font-size="34" font-weight="700">Planned scans and guided investigation</text><text x="290" y="130" text-anchor="middle" font-size="28">OWASP ZAP</text><text x="900" y="130" text-anchor="middle" font-size="28">h5i</text><g fill="#283527" stroke="#78a66d" stroke-width="3" font-size="20"><rect x="80" y="190" width="150" height="70" rx="12"/><rect x="270" y="190" width="150" height="70" rx="12"/><rect x="80" y="330" width="150" height="70" rx="12"/><rect x="270" y="330" width="150" height="70" rx="12"/></g><g font-size="19" text-anchor="middle"><text x="155" y="233">context</text><text x="345" y="233">spider</text><text x="155" y="373">passive scan</text><text x="345" y="373">active scan</text></g><path d="M230 225h40M345 260v55M270 365h-40" stroke="#78a66d" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#78a66d"/></marker></defs><circle cx="900" cy="305" r="155" fill="#241719" stroke="#d21c1c" stroke-width="4"/><g text-anchor="middle" font-size="21"><text x="900" y="230">browser observation</text><text x="900" y="285">choose a request</text><text x="900" y="340">modify + replay</text><text x="900" y="395">record evidence</text></g><text x="290" y="485" text-anchor="middle" font-size="21">known procedure → alerts</text><text x="900" y="505" text-anchor="middle" font-size="21">adaptive procedure → evidence</text><text x="600" y="590" text-anchor="middle" font-size="18" fill="#aaa">ZAP can also be agent-driven; compare the task and the evidence.</text></g></svg>
