<g fill="#f1ede4" font-family="Arial,sans-serif" font-weight="700" font-size="48" text-anchor="middle"><text x="151" y="103">Rust</text><text x="576" y="103">Lean 4</text><text x="1001" y="103">Correctness</text></g>
<g fill="#a5a198" font-family="monospace" font-size="16" text-anchor="middle"><text x="151" y="55">h5i-app</text><text x="576" y="55">EXTRACTED CODE</text><text x="1001" y="55">MACHINE-CHECKED</text></g>
