<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="350" viewBox="0 0 1152 350" role="img" aria-labelledby="title desc">
<title id="title">Rust application logic becomes Lean 4 code whose correctness is proven</title>
<desc id="desc">h5i-app Rust logic is translated by Charon and Aeneas into Lean 4. Security specifications and proofs are checked against that extracted code.</desc>
