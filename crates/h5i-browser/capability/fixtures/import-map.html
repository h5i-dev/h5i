<!doctype html>
<meta charset="utf-8">
<title>a bare specifier the page named</title>
<!--
  docs/roadmap-history.md §B19.8. The engine refuses a bare specifier because a loader that
  invented a CDN would be choosing a destination the page never named. An import
  map does not have that property: the destination is in markup the parser
  already read. This is the fixture that proves the distinction is implemented
  rather than merely argued.
-->
<p id="out">before</p>
<script type="importmap">
  { "imports": { "greeter": "./modules/greeter.js" } }
</script>
<script type="module">
  import { greet } from 'greeter';
  document.getElementById('out').textContent = greet('world');
</script>
