[package]
name = "h5i-browser"
version = "0.1.0"
edition = "2024"
description = "h5i's network layer: the capture proxy's policy, receipts, jar, budget and message store, where every request is policy-checked and receipted before it reaches the wire."

# A library only.

[dependencies]
h5i-error = { path = "../h5i-error" }
# The receipt row and the stored message, as data. Small on purpose: the
# readers of both (the websec plugin, recon) depend on that crate and not on
# this one, so reading a log never links a browser engine.
h5i-wire = { path = "../h5i-wire" }
serde = { workspace = true }
serde_json = { workspace = true }

url = { version = "2.5", features = ["serde"] }

# The operating system's own CSPRNG, for WebSocket keys and multipart
# boundaries.
getrandom = "0.2"

# Already in the tree via reqwest, so this adds no package: it is here to parse
# `Set-Cookie`'s `Expires`, where hand-rolling the format would mean a cookie
# that outlives its deletion.
httpdate = "1"

# Blocking client on purpose: a resend is one verb on the control thread, and
# a sender with no runtime to await on is one whose receipt order is its
# request order.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }

# `socket` speaks RFC 6455 directly (see `ws`): one handshake, four opcodes, no
# extensions. These are the same two crates h5i-core uses, kept at the same
# versions so the workspace holds one copy.
sha1 = "0.10"
base64 = "0.22"
# The public suffix list, compiled in as a static table rather than fetched.
psl = "2.1.226"
# TLS for `wss://`, and only for that.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0"
# The `h5i browser grpc` transport: an HTTP/2 client for gRPC. All already in
# the tree via reqwest, so these add no package.
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Compression, decoded here rather than by the HTTP client.
flate2 = "1.1.9"
brotli = { version = "8.0.4", default-features = false, features = ["std"] }
# zstd, which Chromium asks for and CDNs answer with: proxy-captured bodies and
# replays of Chromium's requests arrive in it. Pure Rust, decode only.
ruzstd = { version = "0.8.3", default-features = false, features = ["std"] }

# The identity digest, which goes in the session record beside the policy's,
# and the message store's content addressing. The same crate h5i-core digests a
# policy with, so two digests written by two halves of one product are the same
# kind of thing. Not optional: `capture` is in every build, because a capability
# gated at build time is one an agent cannot ask for at run time.
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3.8"

# `O_NOFOLLOW`, for the message store: a stored body is never written through a
# symlink someone planted in the session directory.
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
