[package]
name = "h5i-browser-light"
version = "0.1.0"
edition = "2024"
description = "h5i browser light: a lightweight visual browser engine for coding agents, where every request is policy-checked and receipted before it reaches the wire."

# A library only. The engine used to ship as its own binary beside `h5i`; it is
# now reached through `h5i __engine`, which `h5i browser` execs.
#
# The design rule that used to live here — "not so another crate can link past
# the process boundary" — was protecting the *process* boundary, and self-exec
# keeps that exactly: `h5i browser` still runs the engine as a separate process
# and speaks a protocol to it. What went away is the second file, which bought
# an install whose default left the headline command broken, a version skew
# between two halves of one protocol, and a box that could read the engine
# without being allowed to exec it.

[features]
default = ["identity"]

# Browser identities: `--identity`, the coherence validator, and the one object
# the header layer and the script realm both answer from. See `identity.rs`.
#
# On by default, and a feature anyway, for the reason `ytdlp` is one: the two
# switches promise different things. `--identity native` is the default and
# costs nothing at run time — the wire values are computed once when the session
# is built, and with `--script` off there is no realm to read them from at all.
# Without the *feature*, the code is not in the binary: there is no identity
# module, no `Screen` interface, no per-realm crossing to build one, and no
# `--identity` to type. That is a claim a hardened deployment can make about the
# file it installed rather than about how someone invokes it.
#
# It carries `sha2` and `toml` with it, which nothing else in this crate needs:
# a digest for the session record, and the format an identity is written in.
identity = ["dep:sha2", "dep:toml"]

[dependencies]
h5i-error = { path = "../h5i-error" }
serde = { workspace = true }
serde_json = { workspace = true }

# The engine, assembled rather than written: Blitz owns the DOM and drives
# Stylo for CSS; vello_cpu rasterises on the CPU because a box has no GPU.
# Pinned exactly: Blitz is beta and its inter-crate versions are `=` pinned
# upstream, so a range here would only invent skew.
blitz-dom = { version = "=0.3.0-beta.1", default-features = false }
blitz-html = { version = "=0.3.0-beta.1", default-features = false }
blitz-paint = { version = "=0.3.0-beta.1", default-features = false }
blitz-traits = { version = "=0.3.0-beta.1", default-features = false }
anyrender = "0.11"
anyrender_vello_cpu = "0.14"

# Not called from this crate. It is here for one feature.
#
# vello_cpu's glyph painter reaches colour emoji two ways: COLR outlines, which
# are always compiled in, and embedded bitmap strikes, which are PNG-encoded and
# so sit behind `glifo?/png`. `anyrender_vello_cpu` takes vello_cpu with
# `default-features = false` and does not re-add `png`, which switches off the
# only path that can draw a CBDT face — and CBDT is what `NotoColorEmoji.ttf`
# is, on essentially every Linux desktop. The symptom is not a warning; it is
# every emoji on every page silently rendering as a tofu box, because the bitmap
# branch returns `None` and falls through to an outline the font does not have.
#
# Cargo features are additive across a graph, so naming the feature here turns
# it on for the copy `anyrender_vello_cpu` already uses. Pinned exactly, for the
# same reason the Blitz crates above are: this is reaching into a transitive
# dependency's feature set, and a range would let the two drift apart silently.
vello_cpu = { version = "=0.0.9", default-features = false, features = ["png"] }

# `system-fonts` is deliberately OFF: it pulls `yeslogic-fontconfig-sys`,
# which needs libfontconfig headers at *build* time. That would make the
# build depend on the host's dev packages and the render depend on the
# host's font set. Fonts are discovered and registered at runtime instead
# (see `fonts`), so the build stays hermetic and "no fonts" is a state the
# engine can report rather than a blank page nobody can explain.
parley = { version = "0.10", default-features = false, features = ["std"] }

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
url = { version = "2.5", features = ["serde"] }

# The operating system's own CSPRNG, for `crypto.getRandomValues`. A browser
# promises unpredictability there; a seeded generator wearing the name would be
# a lie a page cannot detect.
getrandom = "0.2"

# Already in the tree via reqwest, so this adds no package: it is here to parse
# `Set-Cookie`'s `Expires`, where hand-rolling the format would mean a cookie
# that outlives its deletion.
httpdate = "1"

# One job: stamping the engine's own logs. A log without a clock can be ordered
# within itself and never against anything else, which is what an audit needs
# most — "was a human at the controls when that form was submitted" is a
# question about two logs at once.
chrono = { version = "0.4", features = ["serde"] }

# Stylo's `ToCss`, pinned to the version Blitz uses, so computed values can be
# rendered as the strings CSS actually spells them. Without it `Display` prints
# as its internal bitfield (`display(514)`), which is exactly the plausible lie
# this engine refuses to hand an agent. `package =` because Blitz names it the
# same way and two spellings of one crate would be two crates.
style_traits = { version = "0.19.0", package = "stylo_traits" }

# The selector engine itself, for one thing blitz does not expose: matching from
# an arbitrary node rather than from the document root. `BaseDocument`'s own
# `query_selector_all` always starts at the root, so a detached subtree — every
# cloned `<template>` before it is inserted — could not be searched at all.
style = { version = "0.19.0", package = "stylo" }
# Only for the result buffer stylo's query API writes into.
smallvec = "1"
# The selector types stylo's matching API is written in terms of.
selectors = "0.39"
# Pinned to the version Stylo resolves to, because `CSS.supports` hands a
# `ParserInput` to Stylo's parser and two different cssparser versions would be
# two different types. Stylo re-exports `Parser` but not `ParserInput`.
cssparser = "0.37"
# The encoding labels and decoders the platform defines. Already in the tree via
# blitz; direct here because `TextDecoder` has to answer "is this a real label"
# and decode as that label, and a hand-written UTF-8 loop can do neither.
encoding_rs = "0.8"

# The atomic boa's job-cancellation token is built from. Named here only so the
# token can be held in a struct field; it must be the same type boa hands back.
portable-atomic = "1"

# Blocking client on purpose: `NetProvider::fetch` is called synchronously
# from Blitz's parse/resolve, there is no runtime to await on, and a browser
# that fetches one subresource at a time is a browser whose receipt order is
# its request order.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }

clap = { version = "4.5.60", features = ["derive"] }

# The live view speaks RFC 6455 directly (see `ws`): one handshake, four
# opcodes, no extensions. These are the same two crates h5i-core uses for the
# client half, kept at the same versions so the workspace holds one copy.
sha1 = "0.10"
base64 = "0.22"
# `annex-b` is the standard's own name for "the legacy behaviour every browser
# actually implements": `String.prototype.substr`, the HTML string methods, and
# the sloppy-mode parser rules including HTML-like comments in scripts. Leaving
# it off made this engine stricter than any browser — excalidraw's colour parser
# calls `substr` and died on `not a callable function`.
# Plain crates.io, at last: the git pin existed only because published boa's
# icu requirements clashed with parley's, and `scripts/check_boa_release.sh`
# failed CI the moment 0.22.0 resolved the clash — which is exactly what it
# was written to do.
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
boa_gc = "0.22.0"
# The public suffix list, compiled in as a static table rather than fetched.
#
# This is what makes the `Domain` attribute safe to honour. The rule a browser
# actually enforces is "the domain must not be a public suffix", and without the
# list there is no way to know that `co.uk` is one — so a page on `evil.co.uk`
# could set `Domain=co.uk` and every later request to `bank.co.uk` would carry
# the cookie. Pure Rust, no build script, no network at runtime: it is a
# generated match table, which is the only shape that keeps the build hermetic.
#
# The list does rot, which was the argument against embedding one. It rots
# *slowly* and in a known direction — new suffixes are added, so a stale list
# is conservative about what it refuses rather than permissive — and a version
# bump is how it is refreshed. See `cookies::registrable_domain`.
psl = "2.1.226"
# TLS for `wss://`, and only for that.
#
# The refusal it replaces said `wss://` "needs a raw TLS stream, which the HTTP
# client here does not expose" — true of `reqwest`, and quietly generalised into
# a property of the engine. It is not one. A socket that owns its transport
# needs no help from the HTTP client, which is how Lightpanda gets `wss://` for
# free through curl.
#
# `ring` rather than aws-lc-rs, because aws-lc-rs has a C build and this crate
# refuses those (see `system-fonts` above): the cross-check matrix compiles for
# windows-msvc, darwin and musl from Linux. Both crates are already in the tree
# through reqwest's `rustls-tls`, so this adds a name to the manifest and no
# code to the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0"
# Compression, decoded here rather than by the HTTP client.
#
# The engine had never sent an `Accept-Encoding` header at all, so every
# document, stylesheet and bundle it fetched arrived identity-encoded — three
# to five times its compressed size, an omission the receipts question never
# caught because a receipt recorded that bytes moved and not that three times
# too many did.
#
# `reqwest` will negotiate and decode transparently, and that was tried first.
# It **strips `Content-Encoding` and `Content-Length` after decoding**, so the
# compressed size — the number that says what the request actually cost — is
# gone by the time a body is in hand. An engine whose whole claim is that its
# request log is the truth rather than an observation of it cannot delegate the
# measurement to a layer that then hides it. That is the CONNECT-gate blindness
# this engine exists to remove, in miniature.
#
# So the client asks for encodings, and this crate decodes them: `wire_bytes` is
# *measured*, not read off a header, so it is right under chunked transfer too;
# and the decoded size is capped as well as the compressed one, which is what
# stops a small response decompressing into an enormous one. Both crates are
# pure Rust (flate2 on miniz_oxide), so the hermetic build is unchanged.
flate2 = "1.1.9"
brotli = { version = "8.0.4", default-features = false, features = ["std"] }

# The identity digest, which goes in the session record beside the policy's.
# The same crate h5i-core digests a policy with, so two digests written by two
# halves of one product are the same kind of thing.
sha2 = { workspace = true, optional = true }

# Browser identities are written as TOML, because that is what every other
# thing a person hand-writes for h5i is written as.
toml = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.8"

# `_exit`, for one call: the renderer's "my broker is gone" stop. See
# `BrokerClient::over` in `ipc.rs` for why `std::process::exit` is not enough
# there. Unix only, because the renderer is only ever spawned over a socket
# pair, which is a unix path already.
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
