[package]
name = "h5i-app-core"
description = "Core contract between a verified h5i-app kernel and its untrusted shell"
edition = "2024"
license = "Apache-2.0"
version = "0.5.4"
repository = "https://github.com/h5i-dev/h5i"
homepage = "https://github.com/h5i-dev/h5i"
readme = "../h5i-app/README.md"

[features]
default = ["std"]
# `MemoryEngine`, `Timestamp::now` and the `[authz]` binding.
std = ["alloc", "dep:h5i-app-std"]
# `ReplyCodec`, `Executor`, `sorted_by_key`.
alloc = []

[dependencies]
# The authorization guard `Authz` runs; see `authz`. Needs `std`.
h5i-app-std = { workspace = true, optional = true }
