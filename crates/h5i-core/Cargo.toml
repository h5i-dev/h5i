[package]
name = "h5i-core"
version = "0.2.8"
edition = "2021"
description = "h5i core domain library: disposable, confined development environments and their execution receipts."

[dependencies]
h5i-error = { path = "../h5i-error" }
h5i-sandbox = { path = "../h5i-sandbox" }
git2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2.3.0"
console = "0.16.2"
libc = "0.2.186"

# When targeting musl, vendor OpenSSL so the build doesn't require a musl-linked
# system libssl (libgit2-sys → libssh2-sys → openssl-sys pulls this in).
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3.8"
serde_json = { workspace = true }
