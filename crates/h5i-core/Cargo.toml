[package]
name = "h5i-core"
version = "0.2.8"
edition = "2021"
description = "h5i core domain library: disposable, confined development environments and their execution receipts."

[features]
# `web` compiles the `h5i ui` box console: a read-only, loopback-only HTTP
# surface over the fleet (axum) plus the embedded React bundle from `web/`.
# On by default so `cargo install --path .` gives a working `h5i ui`; build
# with `--no-default-features` for a lean library that never pulls in axum,
# tokio or the asset embedder — and never needs Node to compile.
default = ["web"]
web = ["dep:axum", "dep:tokio", "dep:rust-embed", "dep:mime_guess"]

[dependencies]
h5i-error = { path = "../h5i-error" }
h5i-sandbox = { path = "../h5i-sandbox" }
git2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# `fastrand` for retry jitter and WebSocket frame masking; `getrandom` for the
# console/viewer session tokens, which gate a loopback listener and so need OS
# entropy rather than a fast non-cryptographic generator (see `token`).
fastrand = "2.3.0"
getrandom = "0.3"
console = "0.16.2"
libc = "0.2.186"

# The terminal viewer (`termview`). All three are on the path between an
# untrusted box and the host's terminal, so each is chosen for having a small,
# auditable job rather than for features:
#
# * `sha1` — only to verify the WebSocket `Sec-WebSocket-Accept` handshake.
#   RustCrypto, the same family as the `sha2` above.
# * `base64` — the stream's JPEG payloads arrive base64-encoded, and the Kitty
#   graphics protocol wants base64 going out.
# * `zune-jpeg` — a `#![forbid(unsafe_code)]` JPEG decoder. This one is the
#   security-relevant pick: it parses bytes produced inside the box, so a
#   memory-unsafe decoder here would hand the box the host process.
sha1 = "0.10"
base64 = "0.22"
zune-jpeg = "0.5"

# The box console (`server`), all optional behind the `web` feature. Only
# `tokio`'s listener and multi-thread runtime are used — the domain calls stay
# blocking and are pushed onto `spawn_blocking`, so nothing in this crate
# outside `server.rs` becomes async.
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = [
    "rt-multi-thread",
    "net",
    "signal",
], optional = true }
rust-embed = { version = "8.5", optional = true }
mime_guess = { version = "2.0", optional = true }

# When targeting musl, vendor OpenSSL so the build doesn't require a musl-linked
# system libssl (libgit2-sys → libssh2-sys → openssl-sys pulls this in).
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3.8"
serde_json = { workspace = true }
