<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>h5i viewer</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
    background: #14161a; color: #e6e8eb;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: .75rem;
    padding: .5rem .75rem; background: #1c1f24; border-bottom: 1px solid #2a2e35;
  }
  #status { font-variant-numeric: tabular-nums; color: #9aa3ad; }
  #holder { font-weight: 600; }
  #holder.agent { color: #6fb3f2; }
  #holder.human { color: #78d18c; }
  #url { color: #9aa3ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; display: grid; place-items: center; overflow: hidden; background: #0e1013; }
  #stage { position: relative; line-height: 0; }
  canvas { max-width: 100%; max-height: 100%; cursor: crosshair; }
  #hint { padding: .4rem .75rem; color: #9aa3ad; background: #1c1f24; border-top: 1px solid #2a2e35; }
  #mode { font-weight: 600; letter-spacing: .04em; }
  #mode.view { color: #9aa3ad; }
  #mode.hint, #mode.insert, #mode.interact { color: #f2c14e; }
  #say { color: #f2c14e; }
  /* Over the canvas, in its displayed pixels. `pointer-events: none` so a chip
     never eats a click meant for the page. */
  #hints { position: absolute; inset: 0; pointer-events: none; }
  .chip {
    position: absolute; font: 600 11px/1 ui-monospace, SFMono-Regular, monospace;
    background: #ffc828; color: #141414; border: 1px solid #3c2d00;
    padding: 2px 3px; border-radius: 2px; white-space: nowrap;
  /* The typed prefix is dimmed, not removed, so the label does not shift. */
  }
  .chip .spent { color: #96781e; }
  #keys {
    position: absolute; top: .5rem; right: .5rem; margin: 0;
    background: #1c1f24ee; border: 1px solid #2a2e35; border-radius: 4px;
    padding: .5rem .75rem; color: #e6e8eb; font-size: 12px;
    display: grid; grid-template-columns: auto 1fr; gap: .15rem .75rem;
  }
  #keys kbd { font: 600 12px/1.5 ui-monospace, monospace; color: #f2c14e; }
  #keys .off { color: #6b727b; }
  #log {
    max-height: 30vh; overflow-y: auto; padding: .4rem .75rem;
    background: #101216; border-top: 1px solid #2a2e35;
    font: 11px/1.6 ui-monospace, SFMono-Regular, monospace;
    color: #e08b8b; white-space: pre-wrap; word-break: break-word;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <strong>h5i viewer</strong>
  <!-- Substituted by the forward when it serves this page. The value is one of
       two fixed strings from h5i's own enum, never anything the box supplies. -->
  <span>control at page load: <span id="holder" class="__H5I_HOLDER__">__H5I_HOLDER__</span></span>
  <span id="mode" class="view">VIEW</span>
  <span id="status">connecting…</span>
  <span id="say"></span>
  <span id="url"></span>
</header>
<main>
  <div id="stage">
    <canvas id="screen" width="1280" height="800" tabindex="0"></canvas>
    <div id="hints"></div>
    <dl id="keys" hidden></dl>
  </div>
</main>
<div id="log" hidden></div>
<div id="hint">
  Keys are the viewer's until you press <kbd>i</kbd>. <kbd>?</kbd> lists them.
  Reaching for the controls takes the control lock for you, and the agent's
  automation pauses until you are done with it.
</div>
<script>
// The viewer is served by the forward, so same-origin is the only origin that
// works: the forward refuses a WebSocket whose Origin is anything else.
const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const canvas = document.getElementById("screen");
// `alpha: false` because a page is opaque and compositing a transparent layer
// every frame is work for nothing. `desynchronized` lets the browser skip a
// compositor round trip, which is latency a person driving the page feels.
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const statusEl = document.getElementById("status");
const urlEl = document.getElementById("url");

// The page's own viewport, which is what input coordinates are expressed in.
// It is not necessarily the frame's pixel size: the stream may scale frames
// down, and mapping a click through the frame's dimensions would then land it
// somewhere plausible and wrong.
let viewport = { w: 1280, h: 800 };

let ws;
function connect() {
  // A new connection is a new generation, so a decode still running from the
  // old one is discarded rather than painted onto the new session. `decoding`
  // is deliberately left alone: clearing it here would let the next frame start
  // a second decode alongside the one still running, which is the thing the
  // flag exists to prevent. The in-flight decode's own completion clears it and
  // picks up whatever the new socket queued.
  generation++;
  queuedBytes = null;
  if (pending) { pending.close(); pending = null; }
  ws = new WebSocket(`ws://${location.host}/?token=${encodeURIComponent(token)}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    statusEl.textContent = "connected";
    // Ask for a frame rate rather than taking whatever the box produces. This
    // is a `config` message, and the forward has to let it past the control
    // lock for it to mean anything — it did not, for a while, and the cap was
    // being dropped on every agent-held session in silence. See `classify` in
    // `view.rs`.
    send({ type: "config", maxFps: 30, pacing: "push" });
  };
  ws.onclose = () => { statusEl.textContent = "disconnected"; setTimeout(connect, 1500); };
  ws.onerror = () => { statusEl.textContent = "error"; };
  ws.onmessage = (ev) => {
    // Frames arrive either as a JSON envelope carrying a base64 JPEG or as raw
    // binary, depending on the stream server's mode. Handle both rather than
    // pinning one and breaking on an upstream change.
    if (typeof ev.data === "string") {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === "frame" && msg.data) draw(bytesOfBase64(msg.data));
      else if (msg.type === "status") {
        if (msg.viewportWidth) viewport = { w: msg.viewportWidth, h: msg.viewportHeight };
        statusEl.textContent = msg.screencasting ? "connected" : "not streaming";
        // What the keymap may bind, from the engine's own account. One that
        // lists nothing gets nothing bound.
        features = new Set(Array.isArray(msg.features) ? msg.features : []);
        renderKeys();
      }
      else if (msg.type === "hints") onHints(msg);
      else if (msg.type === "act") {
        // Released before the refusal is shown, so a rejected keystroke does not
        // wedge the ones after it.
        // `focus` releases the first batch; `input_keys` releases each one after.
        if (msg.action === "input_keys" || msg.action === "focus") insertLanded();
        // Only refusals are shown. A click that worked announces itself by the
        // page changing, and a viewer that said so as well would be narrating.
        const reply = msg.reply || {};
        if (reply.ok === false) say(reply.error || "refused");
      }
      // Only errors, the same rule the terminal viewer's pane follows.
      else if (msg.type === "console" && msg.level === "error") logLine("console", msg.text);
      else if (msg.type === "page_error") logLine("page", msg.text);
      else if (msg.type === "url") setUrl(msg.url);
      else if (msg.type === "tabs") {
        const active = (msg.tabs || []).find((t) => t.active);
        if (active) setUrl(active.url);
      }
      return;
    }
    draw(new Uint8Array(ev.data));
  };
}

function bytesOfBase64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Frames are decoded off the main thread, one at a time, and painted at most
// once per animation frame.
//
// `createImageBitmap` decodes on a worker the browser owns; the previous
// `new Image()` with a `data:` URL built a ~70 KB string, parsed a URL and
// decoded on the main thread, per frame, and allocated a fresh element to do it.
//
// The pacing is the other half, and it has to hold at *every* stage rather than
// only at the last one, because the box does not wait for this page: under push
// pacing frames arrive whether or not anything here kept up, so a stage that
// queues instead of dropping grows without bound. So three things are dropped,
// each where it accumulates:
//
//   * bytes that arrived while a decode was running — only the newest is kept,
//     and it is the newest that gets decoded next. Starting a decode per
//     arriving frame instead is the version of this that looks like it drops
//     frames and does not: the drop happens after the expensive part, so the
//     decode jobs and their blobs pile up for as long as decoding is slower
//     than the frame rate.
//   * a decoded bitmap that was never painted, replaced by a newer one.
//     Closed explicitly: bitmaps hold decoded pixels, and waiting for the
//     collector to notice is how a long session grows to a gigabyte.
//   * a decode that finished after the socket it came from was replaced. One
//     decode is in flight at a time, so this is the only way a bitmap can
//     arrive out of order, and it is the reconnect path that produces it.
//
// A hidden tab decodes nothing at all.
let queuedBytes = null;  // newest frame not yet handed to a decoder
let decoding = false;    // a decode is in flight
let pending = null;      // newest decoded frame not yet painted
let scheduled = false;   // a paint is queued for the next animation frame
let generation = 0;      // bumped per connection; an older decode is discarded

function draw(bytes) {
  if (document.hidden) return;
  queuedBytes = bytes;
  if (!decoding) decodeNext();
}

function decodeNext() {
  const bytes = queuedBytes;
  queuedBytes = null;
  if (!bytes) { decoding = false; return; }
  decoding = true;
  const mine = generation;
  createImageBitmap(new Blob([bytes], { type: "image/jpeg" })).then((bitmap) => {
    if (mine !== generation) { bitmap.close(); return; }
    if (pending) pending.close();
    pending = bitmap;
    if (!scheduled) {
      scheduled = true;
      requestAnimationFrame(paint);
    }
  }).catch(() => {
    // A frame the box produced by crashing mid-encode. Dropped, never fatal.
  }).finally(() => {
    decoding = false;
    decodeNext();
  });
}

function paint() {
  scheduled = false;
  const bitmap = pending;
  pending = null;
  if (!bitmap) return;
  if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
    canvas.width = bitmap.width; canvas.height = bitmap.height;
  }
  ctx.drawImage(bitmap, 0, 0);
  bitmap.close();
}

// The URL comes from the page inside the box, so it is untrusted text. It is
// written as a text node rather than as markup, and never as a link.
function setUrl(u) { urlEl.textContent = u || ""; }

// Input is sent optimistically. The forward drops it while the agent holds the
// lock, so nothing here has to be trusted to enforce that.
function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

// The message names below are the ones agent-browser's stream server actually
// dispatches on. It matches `input_mouse`, `input_keyboard` and `input_touch`,
// and falls through to a no-op for anything else — including the DOM event
// names an earlier version of this file sent. That failure is completely
// silent: the socket stays healthy, the frames keep coming, and the page never
// moves. Do not rename these to match the DOM.
function at(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) * (viewport.w / r.width)),
    y: Math.round((e.clientY - r.top) * (viewport.h / r.height)),
  };
}
// CDP wants a button *name*; a numeric DOM index is ignored.
const BUTTONS = ["left", "middle", "right"];
function button(e) { return BUTTONS[e.button] || "none"; }
function mods(e) {
  return (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0);
}
function mouse(e, eventType, extra) {
  send(Object.assign({
    type: "input_mouse",
    eventType,
    button: button(e),
    // A press with clickCount 0 is not a click as far as Chrome is concerned,
    // so anything wired to `click` would never fire.
    clickCount: eventType === "mousePressed" || eventType === "mouseReleased" ? 1 : 0,
    deltaX: 0, deltaY: 0,
    modifiers: mods(e),
  }, at(e), extra || {}));
}

// Moves are coalesced to one per animation frame. A mouse crossing the canvas
// fires hundreds of events a second, and each one that gets sent is a WebSocket
// frame, a CDP dispatch inside the box and a hover recomputation on the page —
// for a position that was already stale when it was sent. Only the newest
// position carries any information.
//
// Presses flush the pending move first. Ordering is the one thing coalescing
// must not break: a press that overtook the move that positioned it is a click
// at the wrong place, and the box has no way to notice.
let pendingMove = null;
let moveScheduled = false;

function flushMove() {
  const e = pendingMove;
  pendingMove = null;
  if (e) mouse(e, "mouseMoved");
}

canvas.addEventListener("mousemove", (e) => {
  pendingMove = e;
  if (moveScheduled) return;
  moveScheduled = true;
  requestAnimationFrame(() => { moveScheduled = false; flushMove(); });
});
canvas.addEventListener("mousedown", (e) => { canvas.focus(); flushMove(); mouse(e, "mousePressed"); });
canvas.addEventListener("mouseup", (e) => { flushMove(); mouse(e, "mouseReleased"); });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("wheel", (e) => {
  // Not coalesced: a wheel event's delta is a quantity, and dropping one loses
  // scroll distance rather than a stale position.
  flushMove();
  mouse(e, "mouseWheel", { deltaX: e.deltaX, deltaY: e.deltaY });
}, { passive: true });

function key(e, eventType) {
  // Only while the canvas has focus, or the browser's own shortcuts stop
  // working anywhere on the page.
  if (document.activeElement !== canvas) return;
  e.preventDefault();
  const m = mods(e);
  // A modified keystroke is a command, not typing: Ctrl-A selects all, it does
  // not type "a". Shift is the exception, since shifted characters arrive
  // already shifted.
  const commanding = m & (1 | 2 | 4);
  let text;
  if (eventType === "keyDown" && !commanding) {
    if (e.key.length === 1) text = e.key;
    else if (e.key === "Enter") text = "\r";
    else if (e.key === "Tab") text = "\t";
  }
  const msg = {
    type: "input_keyboard",
    eventType,
    key: e.key,
    code: e.code,
    // `keyCode` is deprecated in the DOM but it is exactly the Windows virtual
    // key code CDP is asking for, which is why it is used here rather than
    // rebuilt from a lookup table.
    windowsVirtualKeyCode: e.keyCode || 0,
    modifiers: m,
  };
  // Omitted rather than sent as null: CDP rejects the whole command on a null
  // string, and the box discards the error, so one null drops the keystroke.
  if (text !== undefined) msg.text = text;
  send(msg);
}
// ─── the keymap ─────────────────────────────────────────────────────────────
//
// The same keys as the terminal viewer, so there is one thing to learn. The
// table below is the same knowledge as `termview::vim::BINDINGS`, and a test
// parses it out of this file and compares the two — two hand-maintained keymaps
// drift silently.
//
// What differs is what honestly differs: this viewer has a real pointer, so the
// mouse stays live in VIEW. INTERACT is for pages that want the *keyboard*.
const BINDINGS = [
  ["j k", "scroll a line", null],
  ["d u", "scroll half a page", null],
  ["space b", "scroll a page", null],
  ["gg G", "top, bottom", null],
  ["f", "hint, then follow", "hints"],
  ["F", "hint, then type into", "hints"],
  ["yf", "hint, then copy its link", "hints"],
  ["gi", "type into the first field", "insert"],
  ["yy", "copy this page's URL", null],
  ["H L", "back, forward", "history"],
  ["r", "reload", "reload"],
  ["i", "take the pointer (INTERACT)", "pointer"],
  ["D", "console pane", null],
  ["?", "this list", null],
  ["q", "leave", null],
];

let features = new Set();
let mode = "view";
let prefix = "";
// The overlay, from the moment it is asked for to the moment a label is chosen
// or the human gives up.
let hinting = null;

const modeEl = document.getElementById("mode");
const sayEl = document.getElementById("say");
const hintsEl = document.getElementById("hints");
const keysEl = document.getElementById("keys");
const logEl = document.getElementById("log");
const holderEl = document.getElementById("holder");

function setMode(next) {
  mode = next;
  modeEl.textContent = next.toUpperCase();
  modeEl.className = next;
}
function say(text) { sayEl.textContent = text || ""; }

// Features an engine that said *nothing* is assumed to have. Every other gated
// key is new, so silence means no; handing over the keyboard predates all this,
// so for `pointer` the question is "did you say no", not "did you say yes".
// See `vim.rs`.
const FAIL_OPEN = new Set(["pointer"]);

function offers(feature) {
  if (features.has(feature)) return true;
  return FAIL_OPEN.has(feature) && features.size === 0;
}

// Same rule as the resolver in `vim.rs`: a key that cannot work says why rather
// than doing nothing, because a key that does nothing gets pressed harder.
function needs(feature, why) {
  return offers(feature) ? null : why;
}

function resolve(key, pending) {
  if (pending === "") {
    if (key === "g" || key === "y") return { pending: true };
  }
  if (pending === "g") {
    if (key === "g") return { scroll: "top" };
    if (key === "i") return { hints: "insert", autoFirst: true, need: "insert" };
    return {};
  }
  if (pending === "y") {
    if (key === "y") return { yankUrl: true };
    if (key === "f") return { hints: "yank", need: "hints" };
    return {};
  }
  switch (key) {
    case "j": return { scroll: "lineDown" };
    case "k": return { scroll: "lineUp" };
    case "d": return { scroll: "halfDown" };
    case "u": return { scroll: "halfUp" };
    case " ": return { scroll: "pageDown" };
    case "b": return { scroll: "pageUp" };
    case "G": return { scroll: "bottom" };
    case "H": return { history: -1, need: "history" };
    case "L": return { history: 1, need: "history" };
    case "r": return { reload: true, need: "reload" };
    case "f": return { hints: "click", need: "hints" };
    case "F": return { hints: "insert", need: "hints" };
    case "i": return { interact: true, need: "pointer" };
    case "D": return { developer: true };
    case "?": return { help: true };
    default: return {};
  }
}

const WHY = {
  hints: "this session's engine does not offer a hint overlay",
  history: "this session's engine does not keep history for the viewer",
  insert: "this session's engine does not offer typing from the viewer",
  reload: "this session's engine does not offer reload from the viewer",
  pointer: "this session's engine is driven from the keyboard: f reaches anything a click could, and F types into it",
};

function onViewKey(e) {
  if (e.key === "Escape") { prefix = ""; say(""); return; }
  if (e.key.length !== 1 && !ARROWS[e.key]) return;

  const scroll = ARROWS[e.key];
  if (scroll) { doScroll(scroll); return; }

  const pending = prefix;
  prefix = "";
  const action = resolve(e.key, pending);

  if (action.pending) { prefix = e.key; say(e.key + "…"); return; }
  if (action.need) {
    const why = needs(action.need, WHY[action.need]);
    if (why) { say(why); return; }
  }
  say("");

  if (action.scroll) doScroll(action.scroll);
  else if (action.reload) send({ type: "reload" });
  else if (action.history) send({ type: "history", go: action.history });
  else if (action.hints) askForHints(action.hints, !!action.autoFirst);
  else if (action.yankUrl) yank(urlEl.textContent, "this page's URL");
  else if (action.interact) {
    hold(true);
    setMode("interact");
    say("keys go to the page — Esc to stop");
  }
  else if (action.developer) { logEl.hidden = !logEl.hidden; }
  else if (action.help) { keysEl.hidden = !keysEl.hidden; renderKeys(); }
}

const ARROWS = {
  ArrowDown: "lineDown", ArrowUp: "lineUp",
  PageDown: "pageDown", PageUp: "pageUp",
  Home: "top", End: "bottom",
};

// Wheel deltas and Home/End, never a message of ours, so the keys a reader uses
// most work on any engine. The same choice `termview`'s `scroll` makes.
const LINE = 64;
function doScroll(which) {
  const page = viewport.h || 1;
  const delta = {
    lineDown: LINE, lineUp: -LINE,
    halfDown: page / 2, halfUp: -page / 2,
    pageDown: page * 0.9, pageUp: -page * 0.9,
  }[which];
  if (delta !== undefined) {
    send({ type: "input_mouse", eventType: "mouseWheel", x: 0, y: 0,
           button: "none", clickCount: 0, deltaX: 0, deltaY: delta, modifiers: 0 });
    return;
  }
  const key = which === "top" ? "Home" : "End";
  const code = which === "top" ? 36 : 35;
  for (const eventType of ["keyDown", "keyUp"]) {
    send({ type: "input_keyboard", eventType, key, code: key,
           windowsVirtualKeyCode: code, modifiers: 0 });
  }
}

// Reaching for the controls *is* taking them. Taken before the request goes
// out: the labels describe the page now, and an agent navigating in between
// would make them all stale.
function hold(on) {
  send({ type: "control", hold: on });
  holderEl.textContent = on ? "human" : "agent";
  holderEl.className = on ? "human" : "agent";
}

function askForHints(then, autoFirst) {
  hold(true);
  hinting = { then, autoFirst, items: [], typed: "", viewport: { ...viewport } };
  // Narrowed when the human is about to type: labelling a link under `F` or
  // `gi` offers a choice that can only be refused.
  send(then === "insert" ? { type: "hints", for: "text" } : { type: "hints" });
}

function onHints(msg) {
  // An overlay nobody asked for, or one that arrived after the human gave up.
  if (!hinting) return;
  hinting.items = Array.isArray(msg.items) ? msg.items : [];
  if (msg.viewportWidth) hinting.viewport = { w: msg.viewportWidth, h: msg.viewportHeight };

  if (!hinting.items.length) {
    hinting = null;
    hold(false);
    say("nothing on screen to act on");
    return;
  }

  // `gi` wanted a field, not a choice. The overlay was only ever the thing that
  // knows where the fields are.
  if (hinting.autoFirst) {
    const field = hinting.items.find((item) => FIELD_ROLES.has(item.role));
    hinting = null;
    if (!field) { hold(false); say("no field on screen to type into"); return; }
    enterInsert(field.ref);
    return;
  }
  setMode("hint");
  say(PROMPT[hinting.then] + ": type a label, Esc to stop");
  drawHints();
}

const FIELD_ROLES = new Set(["textbox", "searchbox", "combobox"]);
const PROMPT = { click: "follow", insert: "type into", yank: "copy link from" };

// The viewer's half of the hint scheme: the engine mints the labels, each
// viewer tracks its own typing. Acting on a single hit immediately is sound only
// because the labels are prefix-free.
function narrow(items, typed) {
  const want = typed.toLowerCase();
  if (!want) return items.map((_, i) => i);
  return items
    .map((item, i) => [item, i])
    .filter(([item]) => item.label.toLowerCase().startsWith(want))
    .map(([, i]) => i);
}

function drawHints() {
  hintsEl.replaceChildren();
  if (!hinting) return;
  const r = canvas.getBoundingClientRect();
  const stage = document.getElementById("stage").getBoundingClientRect();
  const sx = r.width / (hinting.viewport.w || 1);
  const sy = r.height / (hinting.viewport.h || 1);
  const typed = hinting.typed.length;

  for (const index of narrow(hinting.items, hinting.typed)) {
    const item = hinting.items[index];
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.style.left = ((r.left - stage.left) + item.x * sx) + "px";
    chip.style.top = ((r.top - stage.top) + item.y * sy) + "px";
    // Text nodes, never markup: this came off a page.
    const spent = document.createElement("span");
    spent.className = "spent";
    spent.textContent = item.label.slice(0, typed);
    chip.append(spent, document.createTextNode(item.label.slice(typed)));
    chip.title = (item.role || "") + " " + (item.name || "");
    hintsEl.append(chip);
  }
}

function onHintKey(e) {
  if (e.key === "Escape") { leaveHint(); return; }
  if (e.key === "Backspace") {
    if (hinting) hinting.typed = hinting.typed.slice(0, -1);
    drawHints();
    return;
  }
  if (e.key.length !== 1) return;
  if (!hinting) { leaveHint(); return; }

  // Tried before it is kept, or the overlay sticks behind a dead prefix.
  const attempt = hinting.typed + e.key;
  const hits = narrow(hinting.items, attempt);
  if (!hits.length) { say("no label starts with `" + attempt + "`"); return; }
  if (hits.length === 1 && hinting.items[hits[0]].label.toLowerCase() === attempt.toLowerCase()) {
    const item = hinting.items[hits[0]];
    const then = hinting.then;
    leaveHint();
    actOn(then, item);
    return;
  }
  hinting.typed = attempt;
  say("");
  drawHints();
}

function actOn(then, item) {
  if (then === "click") {
    // Through the verb layer, so the receipt names a role and an accessible name
    // rather than a coordinate.
    send({ type: "act", ref: item.ref, action: "click" });
    hold(false);
    say((item.role || "") + " " + (item.name || ""));
  } else if (then === "insert") {
    // Keeps the lock this overlay took and hands it on.
    enterInsert(item.ref);
  } else if (then === "yank") {
    hold(false);
    if (item.href) yank(item.href, "link");
    else say("a " + (item.role || "control") + " has no link to copy");
  }
}

// The field INSERT is typing into.
//
// A keystroke cannot be answered locally: nothing appears until the engine has
// laid the page out again and encoded a frame, around 40ms. Sent one at a time
// those serialize, so at most one message is on the wire and every key struck
// while it is away goes out together.
//
// Batched, not coalesced: a keystroke is a delta, so dropping the ones in
// between would lose characters. The relayout is still paid once per message.
let inserting = null;

function enterInsert(ref) {
  // The `focus` below is already on the wire, and is acknowledged on the same
  // lane, so it is what releases the first batch.
  inserting = { ref, pending: [], inFlight: true, dirty: false, timer: 0 };
  setMode("insert");
  say("typing — Enter to submit, Esc to stop");
  // The caret goes to the end and what is there stays: emptying it would assume
  // anyone focusing a field meant to replace it.
  send({ type: "act", ref, action: "focus" });
}

// How long to wait before assuming a reply is not coming. This viewer's
// messages pass through a forward that drops input when the control lock is not
// ours, so losing it mid-word would otherwise wedge typing until a reload.
const INSERT_TIMEOUT_MS = 2000;

/// Put the pending keys on the wire, if the last batch has landed.
function flushInsert() {
  if (!inserting || !inserting.pending.length) return;
  if (inserting.inFlight) { inserting.dirty = true; return; }
  inserting.inFlight = true;
  inserting.dirty = false;
  clearTimeout(inserting.timer);
  inserting.timer = setTimeout(() => {
    // Given up on, not retried: the lost batch may have arrived, and repeating
    // it would type the word twice. Only the keys behind it go out.
    if (inserting && inserting.inFlight) { inserting.inFlight = false; flushInsert(); }
  }, INSERT_TIMEOUT_MS);
  const batch = inserting.pending;
  inserting.pending = [];
  send({ type: "input_keys", keys: batch });
}

/// An insert came back. Send what was typed while it was away.
function insertLanded() {
  if (!inserting) return;
  clearTimeout(inserting.timer);
  inserting.inFlight = false;
  if (inserting.dirty) flushInsert();
}

function onInsertKey(e) {
  if (e.key === "Escape") { leaveInsert(); return; }
  if (!inserting) { leaveInsert(); return; }
  if (e.key === "Enter") {
    send({ type: "act", ref: inserting.ref, action: "press", key: "Enter" });
    leaveInsert();
    return;
  }
  // The keystroke itself, not the value it would produce: that is what moves the
  // caret and lets a page listening for typing hear it.
  const key = { key: e.key, modifiers: mods(e) };
  // A chord types nothing: `Ctrl-S` must not put an `s` in the field being
  // saved. Shift is not a chord.
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) key.text = e.key;
  else if (e.key.length === 1 && (e.ctrlKey || e.metaKey || e.altKey)) { /* command */ }
  else if (!EDITING_KEYS.has(e.key)) return;
  inserting.pending.push(key);
  flushInsert();
}

// Keys with no text that still mean something in a field. Anything else with a
// multi-character name is left to the page.
const EDITING_KEYS = new Set([
  "Backspace", "Delete", "Tab",
  "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
  "Home", "End", "PageUp", "PageDown",
]);

// Also called on the way to acting, so the lock is released by whichever action
// is finished with it rather than here.
function leaveHint() { hinting = null; hintsEl.replaceChildren(); setMode("view"); say(""); }
function leaveInsert() {
  if (inserting) clearTimeout(inserting.timer);
  inserting = null;
  hold(false);
  setMode("view");
  say("");
}

// Said honestly: the clipboard API can be refused, so the notice reports what
// was tried.
function yank(text, what) {
  if (!text) { say("no " + what + " to copy"); return; }
  if (!navigator.clipboard) { say("this browser will not let the page copy"); return; }
  navigator.clipboard.writeText(text)
    .then(() => say("copied " + what))
    .catch(() => say("the browser refused the clipboard"));
}

// Bounded: the page decides how much it writes.
const LOG_CAP = 200;
let errors = 0;

function logLine(kind, text) {
  errors++;
  statusEl.textContent = "connected · " + errors + " error" + (errors === 1 ? "" : "s");
  const row = document.createElement("div");
  // Text nodes only. This came from the page.
  row.textContent = kind + "  " + (text || "");
  logEl.append(row);
  while (logEl.childElementCount > LOG_CAP) logEl.firstElementChild.remove();
  logEl.scrollTop = logEl.scrollHeight;
}

function renderKeys() {
  if (keysEl.hidden) return;
  keysEl.replaceChildren();
  for (const [keys, what, need] of BINDINGS) {
    const dt = document.createElement("dt");
    const kbd = document.createElement("kbd");
    kbd.textContent = keys;
    dt.append(kbd);
    const dd = document.createElement("dd");
    dd.style.margin = "0";
    // Shown and marked rather than hidden, so it is clear where the key went.
    const off = need !== null && !offers(need);
    dd.textContent = what + (off ? " (not on this engine)" : "");
    if (off) { dt.className = "off"; dd.className = "off"; }
    keysEl.append(dt, dd);
  }
}

// One entry point, so a key means one thing at a time.
window.addEventListener("keydown", (e) => {
  // Only while the canvas has focus, or the browser's own shortcuts stop
  // working anywhere on the page. The same rule the raw forwarder followed.
  if (document.activeElement !== canvas) return;
  if (mode === "interact") {
    // The one key the viewer keeps, so a page cannot trap the keyboard.
    if (e.key === "Escape") { e.preventDefault(); hold(false); setMode("view"); say(""); return; }
    key(e, "keyDown");
    return;
  }
  e.preventDefault();
  if (mode === "hint") onHintKey(e);
  else if (mode === "insert") onInsertKey(e);
  else onViewKey(e);
}, true);

window.addEventListener("keyup", (e) => {
  if (document.activeElement !== canvas) return;
  // Only INTERACT sends raw keys, so only it has a key-up to pair.
  if (mode === "interact") key(e, "keyUp");
}, true);

// The overlay is in the canvas's displayed pixels, so a resize moves every chip.
window.addEventListener("resize", () => { if (mode === "hint") drawHints(); });

connect();
</script>
</body>
</html>
