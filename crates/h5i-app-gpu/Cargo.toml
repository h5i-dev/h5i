[package]
name = "h5i-app-gpu"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Experimental single-source CUDA compiler probes"
[features]
default = []
gpu = ["dep:cuda-device"]
calculator-probe = ["gpu"]
[dependencies]
calculator-kernel = { path = "../../examples/app/calculator/kernel" }
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust", rev = "4a56e4220aab8ce5d085a411e7f806cebb647d14", optional = true }

# Separate compiler invocation and toolchain; never part of Charon extraction.
[workspace]

[[example]]
name = "result_probe"
required-features = ["gpu"]
