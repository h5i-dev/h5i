[package]
name = "h5i-app-pg"
description = "PostgreSQL engine for h5i-app: tenant-scoped snapshots, SERIALIZABLE execution with retry, idempotency"
edition = "2024"
license = "Apache-2.0"
version = "0.1.4"
repository = "https://github.com/h5i-dev/h5i"
homepage = "https://github.com/h5i-dev/h5i"
readme = "../h5i-app/README.md"

[features]
# Test-only hooks (Tx::backend_pid).
testing = []
# `pool_tls` / `lockdown_tls`: TLS with rustls, server certificate verified.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:ring"]

[dependencies]
h5i-app-core.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-postgres = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
bytes = "1"
tracing = "0.1"
h5i-app-sql.workspace = true
h5i-app-pgsql.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
webpki-roots = { version = "1.0", optional = true }
ring = { version = "0.17", optional = true }
