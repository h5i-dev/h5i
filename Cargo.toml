[workspace]
members = ["crates/*"]
# The h5i-app examples are their own workspace, depending on the h5i-app
# crates by path as an application would. The GPU backends need CUDA and git
# dependencies, so they build separately too.
exclude = [
    "examples/app",
    "crates/h5i-app-gpu/backend-nvvm",
    "crates/h5i-app-gpu/backend-oxide",
]
resolver = "3"

# Shared dependency versions for every workspace crate — a single source of
# truth so the crates never skew versions (a git2/serde mismatch would break
# `#[from]` conversions across a crate boundary).
[workspace.dependencies]
thiserror = "2.0.18"
# No `https`/`ssh`: they pull OpenSSL, and the macOS build linked Homebrew's,
# which is not on every Mac. Nothing here needs them, so git2 cannot fetch,
# push or clone.
git2 = { version = "0.20.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# `preserve_order`: a `json.` edit rewrites the body, and a replay whose keys
# came back sorted is not the request that was recorded.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = { version = "0.8", features = ["parse", "display"] }
sha2 = "0.10"
# h5i-app, the verifiable application framework. Path and version, so the
# crates publish against each other. External dependencies are declared in
# each crate, not here: a user's build of h5i-app must not inherit the h5i
# CLI's feature choices (serde_json's `preserve_order`, for one).
h5i-app-core = { path = "crates/h5i-app-core", version = "0.1.4" }
h5i-app-http = { path = "crates/h5i-app-http", version = "0.1.4" }
h5i-app-json = { path = "crates/h5i-app-json", version = "0.1.4" }
h5i-app-pg = { path = "crates/h5i-app-pg", version = "0.1.4" }
h5i-app-pgsql = { path = "crates/h5i-app-pgsql", version = "0.1.4" }
h5i-app-schema = { path = "crates/h5i-app-schema", version = "0.1.4" }
h5i-app-sql = { path = "crates/h5i-app-sql", version = "0.1.4" }
h5i-app-std = { path = "crates/h5i-app-std", version = "0.1.4" }
h5i-app-token = { path = "crates/h5i-app-token", version = "0.1.4" }

# The repo's primary product is the `h5i` binary, so it lives at the root
# (`cargo install --path .` / `cargo run` do the obvious thing). The library it
# drives is `crates/h5i-core`.
[package]
name = "h5i"
version = "0.5.2"
edition = "2024"
description = "h5i unifies web development, formal verification with Lean 4, and red-teaming around a composable Rust framework (CLI)."

[lib]
name = "h5i"
path = "src/lib.rs"

[[bin]]
name = "h5i"
path = "src/main.rs"

[features]
# `web` adds the `h5i ui` box console and, through h5i-core, the axum server
# and the embedded React bundle it serves. On by default; drop it with
# `--no-default-features` for a build that needs no Node toolchain.
default = ["web", "browser"]
web = ["h5i-core/web"]
# `browser` adds `h5i browser`: the capture proxy a session's Chromium is
# pointed at, its control channel, and the verbs that drive both.
# `url` with it: the workbench's readers parse a stored URL.
browser = ["dep:h5i-browser", "dep:url", "dep:hudsucker", "dep:http-body-util", "dep:tokio"]

[dependencies]
# `default-features = false` so this package's own `web` flag is the single
# switch: without it, h5i-core is built lean rather than pulling axum in
# through its own defaults.
h5i-core = { path = "crates/h5i-core", default-features = false }
# The network layer under the capture proxy: policy, receipts, jar, budget,
# message store and the session control channel.
h5i-browser = { path = "crates/h5i-browser", optional = true }
# The store's types and readers, engine-free, shared with the plugins.
h5i-wire = { path = "crates/h5i-wire" }
# `h5i app`: extract an h5i-app kernel to Lean, gate its proofs, mutate it.
# Drives Charon, Aeneas and Lake as subprocesses, so it links none of them.
h5i-app-cli = { path = "crates/h5i-app-cli" }
# Parsing a stored or given URL. Already in the tree through h5i-browser.
url = { version = "2.5", optional = true }
git2 = { workspace = true }
serde_json = { workspace = true }
# `h5i browser match --regex`: the matcher's patterns. Already in the tree
# through h5i-sandbox, so this adds no package to the build.
regex = "1"
# Carrying a stored request body across the control channel, which is JSON and
# so cannot hold arbitrary bytes. Already in the tree through h5i-browser.
base64 = "0.22"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5"
console = "0.16.2"
# The `kill(pid, 0)` liveness check and the `setsid` that detaches a browser
# session from the terminal that started it (`cli::browser`).
libc = "0.2.186"
# One digest: what a host-placed browser session was allowed to do. A box's
# policy digest comes from its manifest; a host session has no box, so its
# policy is the allowlist it was started with and this is how that becomes a
# comparable value.
sha2 = { workspace = true }
serde = { workspace = true }
# Reading a project's scope file. Already in the tree through h5i-sandbox,
# which parses `.h5i/env.toml`, so this adds a name and no build.
toml = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The runtime under the browser capture proxy (hudsucker is async). Optional
# with `browser`, so a `--no-default-features` build pulls in no runtime.
tokio = { version = "1.0", features = ["rt-multi-thread"], optional = true }
# The Chromium capture lane is a real intercepting HTTP/S proxy.  Hudsucker
# supplies the protocol machinery (CONNECT, TLS, HTTP/2 and WebSockets); h5i's
# handler supplies policy, receipts and the existing message-store format.
hudsucker = { version = "0.25", default-features = false, features = ["rcgen-ca", "rustls-client", "http2"], optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3.8"
# Renders docs/man/man1/h5i.1 in examples/gen_man.rs. A dev-dependency because the
# page is build output: nothing in the shipped binary prints roff.
clap_mangen = "0.2"
# `kill(pid, SIGKILL)` in tests/browser_session_cli.rs: proving that an engine
# that dies is recorded as having died needs a way to make one die.
libc = "0.2.186"
serde_json = { workspace = true }

[profile.dev]
debug = false
