[workspace]
members = ["crates/*"]
resolver = "3"

# Shared dependency versions for every workspace crate — a single source of
# truth so the crates never skew versions (a git2/serde mismatch would break
# `#[from]` conversions across a crate boundary).
[workspace.dependencies]
thiserror = "2.0.18"
git2 = "0.20.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", features = ["parse", "display"] }
sha2 = "0.10"

# The repo's primary product is the `h5i` binary, so it lives at the root
# (`cargo install --path .` / `cargo run` do the obvious thing). The library it
# drives is `crates/h5i-core`.
[package]
name = "h5i"
version = "0.3.9"
edition = "2024"
description = "h5i — secure, auditable browser for AI agents (CLI)."

[lib]
name = "h5i"
path = "src/lib.rs"

[[bin]]
name = "h5i"
path = "src/main.rs"

[features]
# `web` adds the `h5i ui` box console and, through h5i-core, the axum server
# and the embedded React bundle it serves. On by default; drop it with
# `--no-default-features` for a build that needs no Node toolchain.
default = ["web", "share", "runner", "browser", "ytdlp", "identity"]
web = ["h5i-core/web"]
# `browser` links the rendering engine into this binary, which is what
# `h5i browser` execs itself to become (`h5i __engine`).
#
# **This is the product, not one of four parts.** ROADMAP.md is the scope
# authority and its one-liner is "give an AI agent a browser it can drive and
# you can audit"; a build without this cannot do the thing h5i is for, and
# `h5i browser open` has nothing to render a page with. The switch is not a
# statement that the engine is optional, and the comment that used to sit here
# read like one — it predated the pivot.
#
# What it is instead is a build-time convenience, and a measured one: the engine
# is blitz + stylo + boa, and dropping it takes the graph from 455 crates to
# 314. Someone spending the afternoon on boxes, the forum or the runner should
# not pay for a browser they are not touching. That is the whole of the reason,
# and it is enough of one.
#
# Note that `ytdlp` implies it, which is correct — `--via` is a flag on
# `h5i browser transcript`, so there is nowhere to put it without the engine —
# and which means "everything except the browser" has to drop `ytdlp` too, or
# the feature comes straight back in.
browser = ["dep:h5i-browser-light"]
# `identity` adds `--identity` and `h5i browser identity`: one coherent browser
# identity, read by the header layer and the script realm from the same object.
# See `crates/h5i-browser-light/src/identity.rs`.
#
# On by default and gated anyway, for the reason `ytdlp` is. `--identity native`
# is the default and costs nothing at run time. Without the feature there is no
# `--identity` to type, no identity module in the binary, and the engine sends
# the one agent string it has always sent. It implies `browser`, because the
# thing being given an identity is the engine.
identity = ["browser", "h5i-browser-light/identity"]
# `ytdlp` adds the helper lane: `h5i browser transcript --via yt-dlp`, which
# runs yt-dlp to reach the transcripts that are not in a page's markup at all —
# YouTube's above all, whose captions live behind the player's own API.
#
# On by default, and gated anyway, because the two switches promise different
# things. Without the feature the binary has **no code path that execs a
# helper**, which is a claim a hardened deployment can make about the file it
# installed rather than about how someone invokes it. With it, the lane still
# never runs unless `--via` is typed: it is not a fallback from the engine's own
# read, and it never becomes one, because a fetch that quietly left the engine's
# request log is the one thing `h5i browser requests` promises cannot happen.
#
# Implies `browser`: both lanes answer with one reply shape and parse WebVTT
# with one parser, which is what stops them disagreeing about a timestamp.
ytdlp = ["browser", "dep:url"]
# `bpf` adds the runtime-detection collector: an eBPF probe that watches a run
# from the kernel and files what it saw as its own evidence lane (ROADMAP.md
# D1–D14). **Off by default**, for two reasons that both have to be true before
# it earns a place in a default build: it needs `CAP_BPF`, which an ordinary
# install does not have, and it needs a `clang` that can target BPF at build
# time. `h5i box detect probe` reports the state of both on any build.
#
# The *types* ship either way, through h5i-core, so a receipt written by a
# `--features bpf` build is readable by one without it.
bpf = ["h5i-core/bpf"]
# `runner` adds `h5i runner` — pairing with a second Linux machine and running
# boxes there over SSH (ROADMAP.md R1–R13). On by default because the worker
# end of it is this same binary: a runner is an h5i install, so a build that
# could not serve could not be a runner.
runner = ["dep:h5i-runner"]
# `share` adds `h5i box share` / `h5i join` and, through h5i-share, the iroh
# QUIC stack. Drop it for a build with no sharing in it at all;
# `share-tunnel` is the narrower switch that keeps `--tunnel` and drops iroh.
#
# The two are layered rather than parallel because the dependency below is
# declared `default-features = false`: `share-tunnel` buys the crate and its
# loopback/`cloudflared` half, and `share` adds `h5i-share/p2p` on top. Written
# the other way round — an optional dependency carrying its own defaults —
# `--no-default-features --features share-tunnel` still resolved to
# `h5i-share/default`, so the tunnel-only build this comment described could
# not actually be selected.
share = ["share-tunnel", "h5i-share/p2p"]
share-tunnel = ["dep:h5i-share", "dep:tokio"]

[dependencies]
# `default-features = false` so this package's own `web` flag is the single
# switch: without it, h5i-core is built lean rather than pulling axum in
# through its own defaults.
h5i-core = { path = "crates/h5i-core", default-features = false }
# `default-features = false` for the same reason as h5i-core above: the root
# feature list is the single switch. With the dependency's own defaults left
# on, `--features share-tunnel` would still pull iroh in.
h5i-share = { path = "crates/h5i-share", default-features = false, optional = true }
h5i-runner = { path = "crates/h5i-runner", optional = true }
# The rendering engine, linked so `h5i` can exec itself as one. It was a second
# shipped binary until the pivot; see the crate's own Cargo.toml for why one
# file is right now and two were right before.
# `default-features = false` so the root's own `identity` feature is what turns
# identities on, rather than them arriving through the dependency's defaults and
# making the root switch cosmetic. The engine crate's only default feature is
# `identity`, so this leaves the engine itself whole.
h5i-browser-light = { path = "crates/h5i-browser-light", optional = true, default-features = false }
# A scratch directory: the source bundle a `runner create` builds and streams,
# and the workspace `h5i browser transcript --via` gives its helper.
#
# **Not optional, and it used to be.** It was declared with `runner`, which was
# true when the runner was the only caller and stopped being true when the
# browser lane grew one — so `--features browser` did not compile, and nothing
# caught it because CI builds default and `--no-default-features` and neither is
# that combination. A dependency two features need is a dependency of the crate.
tempfile = "3.8"
# For one job, in the helper lane: refusing a URL whose scheme is not http(s)
# before it reaches a program that takes URLs. Already in the tree through
# h5i-browser-light, so this adds a name to the manifest and no code to the
# build, and hand-rolling the check would mean hand-rolling a URL parser.
url = { version = "2.5", optional = true }
git2 = { workspace = true }
serde_json = { workspace = true }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5"
console = "0.16.2"
# The `kill(pid, 0)` liveness check and the `setsid` that detaches a browser
# session from the terminal that started it (`cli::browser`).
libc = "0.2.186"
# One digest: what a host-placed browser session was allowed to do. A box's
# policy digest comes from its manifest; a host session has no box, so its
# policy is the allowlist it was started with and this is how that becomes a
# comparable value.
sha2 = { workspace = true }
serde = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Only to drive `h5i-share`'s async transports from a blocking CLI handler.
# Optional with it, so a `--no-default-features` build pulls in no runtime.
tokio = { version = "1.0", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
# Renders docs/man/man1/h5i.1 in examples/gen_man.rs. A dev-dependency because the
# page is build output: nothing in the shipped binary prints roff.
clap_mangen = "0.2"
# `kill(pid, SIGKILL)` in tests/browser_session_cli.rs: proving that an engine
# that dies is recorded as having died needs a way to make one die.
libc = "0.2.186"
serde_json = { workspace = true }

[profile.dev]
debug = false

# There was a `[patch.crates-io]` here pointing stylo at a vendored one-bool
# fork that enabled `:has()` parsing. Removed by owner decision (2026-08-28):
# an in-tree copy of a rendering-engine crate is not something this project
# will maintain, whatever the WPT arithmetic says. `:has()` is a named gap
# again (`selector :has()` in the unsupported channel) until a Blitz release
# depends on stylo >= 0.20, which is where to check `parse_has` next.

# Boa, patched — and the distinction from the ruling above is the point.
#
# That ruling was against an in-tree *copy* of an engine crate: a vendored
# directory this project would have had to maintain, diverging silently from
# the crate it was forked from. This is the other shape. The fork lives outside
# the tree, is pinned to one commit, and carries one commit of difference:
# `Script::bind_to_realm`, which compiles a script once and runs it in many
# fresh realms. Nothing in it is specific to this engine or this project, it is
# written as an upstream pull request, and the exit is the same as every pin
# here — when it lands upstream this goes back to plain crates.io.
#
# What it buys is in §B15.12a: parse and compile were 67 ms of the 83 ms a
# realm cost, on every page, for a source that never changes. That section
# refused a fork and asked for an upstream issue instead; the owner has since
# ruled a minimal fork acceptable. Of its other two conclusions, one stands and
# one did not survive being checked. Realm *reuse* stays refused, permanently,
# and `bind_to_realm` is careful not to be it. The claim that inline caches
# would carry one page's object shapes into the next was wrong — entries are
# weak and matched by shape identity, so a second realm can never hit them —
# but the remedy it named, clearing them, is still right for a different
# reason: the megamorphic flag is permanent and would otherwise accumulate.
#
# `boa_gc` is patched with it because this crate depends on it directly: left
# on crates.io it would resolve to a second copy, and the cancellation token
# would then be two incompatible types with the same name.
[patch.crates-io]
boa_engine = { git = "https://github.com/h5i-dev/boa", rev = "05a10e4ecf7ae72324138d80be2e9c47e99e7b3d" }
boa_gc = { git = "https://github.com/h5i-dev/boa", rev = "05a10e4ecf7ae72324138d80be2e9c47e99e7b3d" }
