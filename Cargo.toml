[workspace]
members = ["crates/*"]
resolver = "2"

# Shared dependency versions for every workspace crate — a single source of
# truth so the crates never skew versions (a git2/serde mismatch would break
# `#[from]` conversions across a crate boundary).
[workspace.dependencies]
thiserror = "2.0.18"
git2 = "0.20.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", features = ["parse", "display"] }

# The repo's primary product is the `h5i` binary, so it lives at the root
# (`cargo install --path .` / `cargo run` do the obvious thing). The library it
# drives is `crates/h5i-core`.
[package]
name = "h5i"
version = "0.3.2"
edition = "2021"
description = "h5i — disposable, confined development environments for AI coding agents (CLI)."

[[bin]]
name = "h5i"
path = "src/main.rs"

[features]
# `web` adds the `h5i ui` box console and, through h5i-core, the axum server
# and the embedded React bundle it serves. On by default; drop it with
# `--no-default-features` for a build that needs no Node toolchain.
default = ["web"]
web = ["h5i-core/web"]

[dependencies]
# `default-features = false` so this package's own `web` flag is the single
# switch: without it, h5i-core is built lean rather than pulling axum in
# through its own defaults.
h5i-core = { path = "crates/h5i-core", default-features = false }
git2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
console = "0.16.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.8"
serde_json = { workspace = true }

[profile.dev]
debug = false

# Boa 0.21 is the first version that maps a program counter back to a source
# position, which is what lets a page's error say *where* it happened. It cannot
# be used unpatched: 0.21.1 pins `icu_normalizer`, `icu_properties` and
# `icu_segmenter` to `~2.0.0`, which excludes the versions parley requires — and
# parley arrives through blitz, so it is not ours to choose.
#
# The fork is boa at its own v0.21.1 tag plus one commit relaxing those three
# pins to `2`; nothing else differs, and `scripts/verify_boa_fork.sh` proves it.
# Upstream `main` has already made the same change, so this lasts only until the
# next boa release — at which point delete this block and depend on it normally.
#
# Pinned by revision rather than branch: a branch is a moving target, and a
# moving target in a dependency that executes untrusted page script is not one.
[patch.crates-io]
boa_engine = { git = "https://github.com/h5i-dev/boa", rev = "312bbd702781c7e2d101fda2a19ca3d1fc9d24bc" }
boa_parser = { git = "https://github.com/h5i-dev/boa", rev = "312bbd702781c7e2d101fda2a19ca3d1fc9d24bc" }
# `boa_gc` too, and this one is not about the pins: we derive `Trace` for the
# host handle, and a derive from the registry's boa_gc does not satisfy a trait
# from the fork's. Two copies of a crate that defines a trait are two traits.
boa_gc = { git = "https://github.com/h5i-dev/boa", rev = "312bbd702781c7e2d101fda2a19ca3d1fc9d24bc" }
