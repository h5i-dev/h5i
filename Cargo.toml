[workspace]
members = ["crates/*"]
# The h5i-app examples are their own workspace, depending on the h5i-app
# crates by path as an application would.
exclude = ["examples/app"]
resolver = "3"

# Shared dependency versions for every workspace crate — a single source of
# truth so the crates never skew versions (a git2/serde mismatch would break
# `#[from]` conversions across a crate boundary).
[workspace.dependencies]
thiserror = "2.0.18"
# No `https`/`ssh`: they pull OpenSSL, and the macOS build linked Homebrew's,
# which is not on every Mac. Nothing here needs them, so git2 cannot fetch,
# push or clone.
git2 = { version = "0.20.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# `preserve_order`: a `json.` edit rewrites the body, and a replay whose keys
# came back sorted is not the request that was recorded.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = { version = "0.8", features = ["parse", "display"] }
sha2 = "0.10"
# h5i-app, the verifiable application framework. Path and version, so the
# crates publish against each other. External dependencies are declared in
# each crate, not here: a user's build of h5i-app must not inherit the h5i
# CLI's feature choices (serde_json's `preserve_order`, for one).
h5i-app-core = { path = "crates/h5i-app-core", version = "0.1.0" }
h5i-app-http = { path = "crates/h5i-app-http", version = "0.1.0" }
h5i-app-json = { path = "crates/h5i-app-json", version = "0.1.0" }
h5i-app-pg = { path = "crates/h5i-app-pg", version = "0.1.0" }
h5i-app-pgsql = { path = "crates/h5i-app-pgsql", version = "0.1.0" }
h5i-app-schema = { path = "crates/h5i-app-schema", version = "0.1.0" }
h5i-app-sql = { path = "crates/h5i-app-sql", version = "0.1.0" }
h5i-app-std = { path = "crates/h5i-app-std", version = "0.1.0" }
h5i-app-token = { path = "crates/h5i-app-token", version = "0.1.0" }

# The repo's primary product is the `h5i` binary, so it lives at the root
# (`cargo install --path .` / `cargo run` do the obvious thing). The library it
# drives is `crates/h5i-core`.
[package]
name = "h5i"
version = "0.4.9"
edition = "2024"
description = "h5i: the agent-native web security workspace. Red-team web apps with a browser and HTTP control, and prove application logic in Lean 4 (CLI)."

[lib]
name = "h5i"
path = "src/lib.rs"

[[bin]]
name = "h5i"
path = "src/main.rs"

[features]
# `web` adds the `h5i ui` box console and, through h5i-core, the axum server
# and the embedded React bundle it serves. On by default; drop it with
# `--no-default-features` for a build that needs no Node toolchain.
default = ["web", "browser", "ytdlp", "identity"]
web = ["h5i-core/web"]
# `browser` links the rendering engine into this binary, which is what `h5i browser` execs
# itself to become (`h5i __engine`).
# `url` with it: the workbench's readers parse a stored URL, and they are
# gated with `browser` rather than with `ytdlp`, which is where the dependency
# used to arrive by accident.
browser = ["dep:h5i-browser", "dep:url", "dep:hudsucker", "dep:http-body-util", "dep:tokio"]
# `identity` adds `--identity` and `h5i browser identity`: one coherent browser
# identity, read by the header layer and the script realm from the same object.
# See `crates/h5i-browser/src/identity.rs`.
#
# On by default and gated anyway, for the reason `ytdlp` is. `--identity native`
# is the default and costs nothing at run time. Without the feature there is no
# `--identity` to type, no identity module in the binary, and the engine sends
# the one agent string it has always sent. It implies `browser`, because the
# thing being given an identity is the engine.
identity = ["browser", "h5i-browser/identity"]
# `ytdlp` adds the helper lane: `h5i browser transcript --via yt-dlp`, which runs yt-dlp to
# reach the transcripts that are not in a page's markup at all — YouTube's above all, whose
# captions live behind the player's own API.
ytdlp = ["browser", "dep:url"]

[dependencies]
# `default-features = false` so this package's own `web` flag is the single
# switch: without it, h5i-core is built lean rather than pulling axum in
# through its own defaults.
h5i-core = { path = "crates/h5i-core", default-features = false }
# The rendering engine, linked so `h5i` can exec itself as one. It was a second
# shipped binary until the pivot; see the crate's own Cargo.toml for why one
# file is right now and two were right before.
# `default-features = false` so the root's own `identity` feature is what turns
# identities on, rather than them arriving through the dependency's defaults and
# making the root switch cosmetic. The engine crate's only default feature is
# `identity`, so this leaves the engine itself whole.
h5i-browser = { path = "crates/h5i-browser", optional = true, default-features = false }
# The store's types and readers, engine-free, shared with the plugins.
h5i-wire = { path = "crates/h5i-wire" }
# `h5i app`: extract an h5i-app kernel to Lean, gate its proofs, mutate it.
# Drives Charon, Aeneas and Lake as subprocesses, so it links none of them.
h5i-app-cli = { path = "crates/h5i-app-cli" }
# A scratch directory: the workspace `h5i browser transcript --via` gives its
# helper.
tempfile = "3.8"
# For one job, in the helper lane: refusing a URL whose scheme is not http(s)
# before it reaches a program that takes URLs. Already in the tree through
# h5i-browser, so this adds a name to the manifest and no code to the
# build, and hand-rolling the check would mean hand-rolling a URL parser.
url = { version = "2.5", optional = true }
git2 = { workspace = true }
serde_json = { workspace = true }
# `h5i browser match --regex`: the matcher's patterns. Already in the tree
# through h5i-sandbox, so this adds no package to the build.
regex = "1"
# Carrying a stored request body across the control channel, which is JSON and
# so cannot hold arbitrary bytes. Already in the tree through h5i-browser.
base64 = "0.22"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5"
console = "0.16.2"
# The `kill(pid, 0)` liveness check and the `setsid` that detaches a browser
# session from the terminal that started it (`cli::browser`).
libc = "0.2.186"
# One digest: what a host-placed browser session was allowed to do. A box's
# policy digest comes from its manifest; a host session has no box, so its
# policy is the allowlist it was started with and this is how that becomes a
# comparable value.
sha2 = { workspace = true }
serde = { workspace = true }
# Reading a project's scope file. Already in the tree through h5i-sandbox,
# which parses `.h5i/env.toml`, so this adds a name and no build.
toml = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The runtime under the browser capture proxy (hudsucker is async). Optional
# with `browser`, so a `--no-default-features` build pulls in no runtime.
tokio = { version = "1.0", features = ["rt-multi-thread"], optional = true }
# The Chromium capture lane is a real intercepting HTTP/S proxy.  Hudsucker
# supplies the protocol machinery (CONNECT, TLS, HTTP/2 and WebSockets); h5i's
# handler supplies policy, receipts and the existing message-store format.
hudsucker = { version = "0.25", default-features = false, features = ["rcgen-ca", "rustls-client", "http2"], optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
# Renders docs/man/man1/h5i.1 in examples/gen_man.rs. A dev-dependency because the
# page is build output: nothing in the shipped binary prints roff.
clap_mangen = "0.2"
# `kill(pid, SIGKILL)` in tests/browser_session_cli.rs: proving that an engine
# that dies is recorded as having died needs a way to make one die.
libc = "0.2.186"
serde_json = { workspace = true }

[profile.dev]
debug = false

# Pinned fork providing `Script::bind_to_realm`; return to crates.io when the
# upstream change lands. Patch `boa_gc` too to avoid incompatible duplicate types.
[patch.crates-io]
boa_engine = { git = "https://github.com/h5i-dev/boa", rev = "f3d34b44" }
boa_gc = { git = "https://github.com/h5i-dev/boa", rev = "f3d34b44" }
