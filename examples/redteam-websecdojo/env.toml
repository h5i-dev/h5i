# Example red-teaming profile for h5i boxes.
#
# Copy this file's `[profile.redteam]` block into your repo's `.h5i/env.toml`
# (or point an empty box at it), then:
#
#   h5i box create rt --profile redteam --isolation supervised
#   h5i box shell rt
#   # inside the box:
#   claude            # solve the challenge; drive it with `h5i browser` + `h5i websec`
#
# The target here is https://websecdojo.com/ , a public web-security practice
# range. Swap the egress hosts for whatever you are authorized to test.
#
# What this profile sets up, and why it "just works":
#   - It grants ~/.claude* HOME state. h5i treats that as an agent-capable
#     profile, so it seeds a copy of your claude session in, sets IS_SANDBOX=1
#     (so `claude --dangerously-skip-permissions` runs as the box's uid 0), and
#     installs h5i's own plugins (websec/recon) into the box automatically.
#   - Egress is scoped (supervised tier = nftables pinned to resolved IPs) to
#     the practice target, the Anthropic API (so the in-box agent authenticates)
#     and public CVE / advisory references.

[profile.redteam]
isolation = "supervised"

[profile.redteam.fs]
read = [
  "/usr", "/lib", "/lib64", "/bin", "/sbin", "/etc", "/nix", "/opt",
  "/tmp", "/dev/null", "/dev/zero", "/dev/urandom", "/proc",
  "~/.local/bin", "~/.local/lib", "~/.local/share", "~/.nvm",
  "~/.cargo/env", "~/.cargo/bin", "~/.cargo/registry", "~/.cargo/git",
  "~/.bashrc", "~/.profile", "~/.inputrc", "~/.gitconfig", "~/.config/git",
  "/usr/share/fonts", "/etc/fonts", "~/.cache/fontconfig",
]
write = ["$WORK", "/dev/null", "~/.claude", "~/.claude.json", "~/.cache", "~/.npm", "/tmp", "/dev/shm"]
deny = ["~/.ssh", "~/.aws", "~/.config/gh"]

[profile.redteam.net]
mode = "deny"
egress = [
  "websecdojo.com", "www.websecdojo.com",
  "api.anthropic.com", "platform.claude.com", "statsig.anthropic.com",
  "nvd.nist.gov", "services.nvd.nist.gov", "cve.mitre.org", "www.cve.org", "cve.org",
]
unix = true

[profile.redteam.resources]
mem = "8G"
procs = 1024
wall = "45m"
