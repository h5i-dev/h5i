[package]
name = "roles-kernel"
description = "Documents behind inherited roles and path patterns, written with h5i-app-std"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

# Extracted to Lean by Charon + Aeneas, together with the h5i-app-std
# functions it calls (`--include h5i_app_std`).
[dependencies]
h5i-app-std = { path = "../../../../crates/h5i-app-std" }

# Written in the subset of Rust that Charon + Aeneas translate: `&Vec`, no
# closures in the kernel. Clippy's idiomatic rewrites leave that subset.
[lints.clippy]
manual_unwrap_or_default = "allow"
ptr_arg = "allow"
vec_init_then_push = "allow"
