# Read by `h5i app` (extract, check, prove, mutate, doctor).

[extract]
start-from = ["guarded_transition", "read_only"]
schema = true
include = ["h5i_app_sql", "h5i_app_std"]
std-specs = true

[authz]
# `guarded_transition`, written by `h5i_app_std::authz_kernel!`. The policy it
# guards with is generated by `schema!` from its `policy` block; the generated
# Schema.lean proves the extracted policy computes `notes_kernel.PolicySpec`.
guarded = ["guarded_transition"]

[obligations]
# Opt in to `tenant-of-token`, with a named theorem: `check` requires
# `proofs/Tenant.lean`'s theorem to state exactly
# `H5iAppLib.Obligation.TenantOfToken notes_kernel.tenant_of notes_kernel.principal`.
# There is no server, so `h5i app report` says `proven, not linked`.
principal = "principal"
tenant-of-token = "notes_kernel.Tenant.tenant_of_token"
