# Read by `h5i app` (extract, check, prove, mutate, doctor).

[extract]
start-from = [
    "transition",
    "apply",
    "read_scope",
    "check_inv",
    "sql_writes",
    "decode",
    "scoped_project",
]
schema = true
include = ["h5i_app_sql"]

[check]
# Must exist and use only the standard axioms (every theorem in a hand-written
# module is gated as well).
theorems = [
    "H5iAppLib.Store.App.served_holds",
    "H5iAppLib.Store.App.served_lists",
    "H5iAppLib.Pg.compile_sound",
    "H5iAppLib.Pg.compileAll_sound",
    "H5iAppLib.Pg.select_sound",
    "H5iAppLib.Pg.lists_of_selects",
    "H5iAppLib.Pg.create_fresh",
    "H5iAppLib.Pg.create_kept",
    "H5iAppLib.Pg.lexName_quote",
    "docs_kernel.Theorems.allows_eq",
    "docs_kernel.Theorems.transition_total",
    "docs_kernel.Theorems.apply_eq",
    "docs_kernel.Theorems.authorized",
    "docs_kernel.Theorems.reply_confined",
    "docs_kernel.Theorems.inv_preserved",
    "docs_kernel.Theorems.reachable_inv",
    "docs_kernel.Theorems.noninterference",
    "docs_kernel.Frame.transition_frame",
    "docs_kernel.Check.check_inv_spec",
    "docs_kernel.Storage.encode_applyAll",
    "docs_kernel.Storage.stored",
    "docs_kernel.Storage.sql_writes_spec",
    "docs_kernel.Storage.sql_writes_stored",
    "docs_kernel.Load.fresh",
    "docs_kernel.Load.decode_spec",
    "docs_kernel.Load.load_sound",
    "docs_kernel.Load.store_sound",
    "docs_kernel.Load.sql_writes_storedC",
    "docs_kernel.Scoped.scoped_sound",
    "docs_kernel.Scoped.scoped_command",
    "docs_kernel.Scoped.served_inv",
    "docs_kernel.Theorems.emit_publishes",
    "docs_kernel.Scenarios.authorized_reachable",
    "docs_kernel.Scenarios.noninterference_reachable",
    "docs_kernel.Scenarios.transition_frame_reachable",
    "docs_kernel.Scenarios.published_reachable",
    "docs_kernel.Database.pg_served",
    "docs_kernel.Database.db_inv",
]

[mutate]
# Scenarios runs the extracted kernel on concrete states, so it catches
# mutants that break a run without breaking a theorem.
targets = [
    "Theorems",
    "Invariants",
    "Noninterference",
    "Frame",
    "Check",
    "Storage",
    "Load",
    "Scoped",
    "Scenarios",
]

