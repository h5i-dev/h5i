[package]
name = "calculator-server"
description = "Tutorial 1: the calculator's HTTP server and PostgreSQL store"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[dependencies]
h5i-app-core = { path = "../../../../../crates/h5i-app-core" }
h5i-app-pg = { path = "../../../../../crates/h5i-app-pg" }
h5i-app-http = { path = "../../../../../crates/h5i-app-http" }
h5i-app-json = { path = "../../../../../crates/h5i-app-json" }
calculator-kernel = { path = "../kernel" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
