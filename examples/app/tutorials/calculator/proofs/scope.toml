# What these proofs cover and what they leave to the shell. Read by `h5i ui`.
app = "calculator"
title = "calculator with one memory register per user"
kernel = "../kernel"
server = "../server"

# Server app; the tutorial says the JSON decoder is trusted (A2).
assumes = ["A1", "A2", "A4", "A5", "A6", "A7", "A8", "A9", "A10"]

[[trusted_input]]
name = "command"
from = "the JSON decoder"
note = "a wrong decoding can only produce a command the client could have sent directly"

[[out_of_scope]]
item = "store agreement with apply"
reason = "the store must write what apply says; the test checks it here, not a proof"
ref = "examples/app/tutorials/calculator/TUTORIAL.md"
