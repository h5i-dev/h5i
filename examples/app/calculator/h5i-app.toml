# Read by `h5i app` (extract, check, prove, mutate, doctor).

[extract]
start-from = ["transition", "apply", "sql_writes", "read_only"]
schema = true
include = ["h5i_app_sql"]

[check]
# Must exist and use only the standard axioms (every theorem in a hand-written
# module is gated as well).
theorems = ["calculator_kernel.Storage.pg_stored", "calculator_kernel.ReadOnly.sound"]

[obligations]
# `Kernel::read_only` is overridden: `check` requires this theorem to state
# `H5iAppLib.Obligation.ReadOnlySound calculator_kernel.read_only
# calculator_kernel.transition _` (the write set is an `Option`, so the write
# list is the theorem's own and is printed for review).
read-only = "calculator_kernel.ReadOnly.sound"
# `check`'s automation sees no hand-written lemma (it runs without the app's
# Lean), so the proof from `transition_total` is named here.
panic-free = "calculator_kernel.Proofs.panic_free"

[[mutant]]
name = "underflow_boundary"
old = "if a < b {"
new = "if a <= b {"
