[package]
name = "conduit-server"
description = "The RealWorld Conduit API on the verified conduit kernel, with a PostgreSQL store"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[dependencies]
# Framework crates from this checkout; this copy is a benchmark fixture.
h5i-app-core = { path = "../../../crates/h5i-app-core" }
h5i-app-pg = { path = "../../../crates/h5i-app-pg" }
h5i-app-http = { path = "../../../crates/h5i-app-http" }
h5i-app-json = { path = "../../../crates/h5i-app-json" }
conduit-kernel = { path = "../kernel" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Passwords (cost 12) and tokens (HS256, `sub` = user id), as the RealWorld
# benchmark's other servers.
bcrypt = "0.17"
jsonwebtoken = "9"
# Sends a listing's count with its plan on one connection.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

h5i-app-mem = { path = "../../../crates/h5i-app-mem" }

[dev-dependencies]
# `examples/load.rs` seeds the benchmark data with plain SQL.
tokio-postgres = "0.7"
