name = "ThermostatClosedLoop#model_check"
module = "ThermostatClosedLoop"
kind = "safety"
instantiation = "{ HeatMode := HeatMode_IndT, TempBand := TempBand_IndT, SetpointBand := SetpointBand_IndT }"

