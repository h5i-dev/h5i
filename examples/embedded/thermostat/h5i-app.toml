# Read by `h5i app` (extract, check, prove, mutate, doctor).

[extract]
start-from = ["transition", "apply", "read_only", "INITIAL"]

[check]
# Must exist and use only the standard axioms (every theorem in a hand-written
# module is gated as well).
theorems = [
    "thermostat_kernel.Proofs.transition_total",
    "thermostat_kernel.Proofs.inv_reachable",
    "thermostat_kernel.ReadOnly.sound",
]

[[mutant]]
name = "interlock_boundary"
old = "if temp_dc >= MAX_TEMP_DC {"
new = "if temp_dc > MAX_TEMP_DC {"

[[mutant]]
name = "relay_bound"
old = "if i >= RELAYS {"
new = "if i > RELAYS {"

[[mutant]]
name = "setpoint_upper"
old = "*dc > MAX_SETPOINT_DC"
new = "*dc > MAX_TEMP_DC"

# Optional Veil temporal verification (`proofs/temporal/`).
# Kept disabled by default so normal `h5i app check` / `prove` never require Veil.
# Run with `h5i app temporal-check --enable` or `h5i app prove --temporal`
# (or flip `temporal = true` when Veil is installed).
[verification]
temporal = false
temporal_backend = "veil"
temporal_dir = "proofs/temporal"
temporal_targets = ["ThermostatTemporal"]

# Lean theorems checked by `H5iAppVeil.Gate.checkTheorem` for:
#   1. `ci.isTheorem` (rejects `def`),
#   2. standard axioms only, and
#   3. `Kernel.isDefEq` against the declared `statement`.
# `scope` is a user-declared classification recorded in reports:
#   - `kernel_implementation_level`: purely over the Aeneas-extracted Rust kernel
#   - `compositional`: extracted kernel + handwritten runtime/environment model
#   - `model_level`: purely over a handwritten abstract Veil model
[[verification.temporal_theorems]]
name = "ThermostatTemporal.ExtractedBridge.extracted_thermostat_always_inv"
scope = "kernel_implementation_level"
statement = """
∀ (e : Lentil.exec thermostat_kernel.Snapshot),
  ThermostatTemporal.ExtractedBridge.thermostatKernelRTS.init () (e 0) →
  (∀ n, ThermostatTemporal.ExtractedBridge.thermostatKernelRTS.next () (e n) (e (n + 1)) ∨ e (n + 1) = e n) →
  Lentil.always (Lentil.state_pred thermostat_kernel.Proofs.Inv) e 0
"""

[[verification.temporal_theorems]]
name = "ThermostatTemporal.ExtractedBridge.extracted_firmware_always_inv"
scope = "compositional"
statement = """
∀ (e : Lentil.exec ThermostatTemporal.ExtractedBridge.FirmwareState),
  ThermostatTemporal.ExtractedBridge.extractedFirmwareRTS.init () (e 0) →
  (∀ n, ThermostatTemporal.ExtractedBridge.extractedFirmwareRTS.next () (e n) (e (n + 1)) ∨ e (n + 1) = e n) →
  Lentil.always (Lentil.state_pred (fun fs => thermostat_kernel.Proofs.Inv fs.snap)) e 0
"""

[[verification.temporal_theorems]]
name = "ThermostatTemporal.ExtractedBridge.extracted_thermostat_overtemp_liveness"
scope = "compositional"
statement = """
∀ (e : Lentil.exec ThermostatTemporal.ExtractedBridge.FirmwareState),
  ThermostatTemporal.ExtractedBridge.extractedFirmwareRTS.init () (e 0) →
  (∀ n, ThermostatTemporal.ExtractedBridge.extractedFirmwareRTS.next () (e n) (e (n + 1)) ∨ e (n + 1) = e n) →
  Lentil.weak_fairness ThermostatTemporal.ExtractedBridge.senseAction e 0 →
  Lentil.weak_fairness ThermostatTemporal.ExtractedBridge.actuateAction e 0 →
  Lentil.eventually (Lentil.always (Lentil.state_pred (fun fs => 350 ≤ fs.physTemp.val ∨ fs.sensorFailed = true))) e 0 →
  Lentil.eventually (Lentil.always (Lentil.state_pred (fun fs => fs.pinHeater = false))) e 0
"""

# Model-level exhaustive Veil checks executed via `H5iAppVeil.Gate.runVeilCheck`.
