name = "h5i-spec"
version = "0.1.0"
defaultTargets = ["H5iSpec", "H5iFs", "h5i-spec"]

# Lean core only — Lean.Data.Json carries the JSON glue, so there is no
# mathlib (or any other) dependency to download or build. Keep it that way:
# the DRT harness builds this package in CI, and a dependency here is a
# dependency of every Rust contributor who runs the harness.

[[lean_lib]]
name = "H5iSpec"

# The filesystem authority machine (ROADMAP §VF). Builds on H5iSpec.Landlock;
# checked on every `lake build`, same no-mathlib toolchain.
[[lean_lib]]
name = "H5iFs"

[[lean_exe]]
name = "h5i-spec"
root = "Main"
